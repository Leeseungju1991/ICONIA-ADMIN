# -----------------------------------------------------------------------------
# deploy-admin.yml — build the ICONIA-ADMIN image, push to ECR, roll the ECS service.
#
# Prerequisites (created once by the root `infra/` Terraform module):
#   * ECR repo + ECS cluster/service exist
#   * a GitHub OIDC deploy role exists (output: github_actions_role_arn)
#
# Required repository VARIABLES (Settings -> Secrets and variables -> Actions ->
# Variables — NON-sensitive, so use variables, not secrets):
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::<account>:role/iconia-<env>-github-actions-deploy
#   AWS_REGION           ap-northeast-2
#   ECR_REPOSITORY       <account>.dkr.ecr.<region>.amazonaws.com/iconia-<env>/admin
#   ECS_CLUSTER          iconia-<env>-cluster
#   ECS_SERVICE          iconia-<env>-admin
#
# [2026-06-24] P1 수정: push:main 트리거 제거 — CI 게이트 없이 ECS 배포가 진행되던
# 문제 해결. SERVER/AI deploy-server.yml/deploy-ai.yml 과 동일하게 workflow_dispatch
# 수동 트리거만 남김. 실 배포 정본은 ICONIA-CI/deploy.yml (SSM EC2 경로).
# ECS ADMIN 배포(CloudFront→ALB:8082→ECS)는 수동 dispatch 시에만 실행됨.
# -----------------------------------------------------------------------------
name: deploy-admin

on:
  # push 트리거 제거 — CI 게이트(lint/typecheck/test) 없이 ECS 배포가 진행되던 P1 이슈.
  # 아래 주석을 해제하려면 반드시 needs: [admin-lint, admin-typecheck, admin-test] 를 deploy job에 추가할 것:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY }}:latest

      - name: Trigger ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"
