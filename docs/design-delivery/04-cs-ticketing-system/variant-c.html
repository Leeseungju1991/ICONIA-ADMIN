<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CS 티켓팅 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">CS 티켓팅 폴더</a></div>
    <h1>CS 티켓팅·응대 관리 시스템 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 대화형 채팅 스레드(라이브챗)</h4>
      <ul><li>카카오톡·문자와 닮은 대화형 UI — 실시간 채팅 상담에 가장 자연스러운 형태</li><li>고객과의 대화 사이사이 상담사끼리만 보는 내부 메모를 남길 수 있음</li></ul>
    </div>

    <div class="page-title-row"><h2 style="margin:0">진행 중인 대화</h2></div>
    <div class="glass-panel" id="chat-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '04c';
  const SEED = [
    { id:'c1', customer:'김하나', subject:'배송 지연 문의', status:'처리중', messages:[
      { who:'customer', text:'안녕하세요, 주문한 지 5일이 지났는데 배송이 시작 안 됐어요.', time:'14:02' },
      { who:'internal', text:'🔒 내부 메모: 물류센터 확인 결과 재고 부족으로 지연 — 09-29 입고 예정', time:'14:04' },
      { who:'agent', text:'불편을 드려 죄송합니다. 확인해보니 재고 입고 지연으로 09월 29일 출고 예정입니다.', time:'14:05' },
      { who:'customer', text:'알겠습니다, 그럼 그때까지 기다릴게요.', time:'14:06' },
    ]},
    { id:'c2', customer:'이도윤', subject:'환불 요청', status:'신규', messages:[
      { who:'customer', text:'단순 변심으로 환불하고 싶습니다.', time:'13:10' },
    ]},
    { id:'c3', customer:'최서연', subject:'제품 사용법 문의', status:'완료', messages:[
      { who:'customer', text:'제품 사용법을 문의드립니다.', time:'어제' },
      { who:'agent', text:'사용 설명서를 이메일로 보내드렸습니다.', time:'어제' },
    ]},
  ];
  function loadChats() {
    let list = sgGetJSON('sg-chats-' + NS, null);
    if (!list) { list = SEED; sgSetJSON('sg-chats-' + NS, list); }
    return list;
  }
  function statusChip(s) { return s === '완료' ? 'chip-success' : s === '처리중' ? 'chip-warn' : 'chip-info'; }
  const chats = loadChats();
  document.getElementById('chat-list').innerHTML = chats.map((c, i) => {
    const last = c.messages[c.messages.length - 1];
    return '<a href="./variant-c-chat.html?id=' + c.id + '" style="text-decoration:none;color:inherit;display:block;padding:12px 0;' + (i < chats.length - 1 ? 'border-bottom:1px solid var(--hairline)' : '') + '">' +
      '<b style="font-size:13px">' + c.subject + '</b> <span class="chip ' + statusChip(c.status) + '" style="margin-left:6px">' + c.status + '</span>' +
      '<div style="font-size:12px;color:var(--slate-500);margin-top:4px">' + c.customer + ' · ' + (last ? last.text.slice(0, 30) + (last.text.length > 30 ? '…' : '') : '') + '</div></a>';
  }).join('');
</script>
</body>
</html>
