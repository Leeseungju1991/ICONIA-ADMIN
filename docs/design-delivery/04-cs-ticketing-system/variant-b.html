<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CS 티켓팅 — 시안 B</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">CS 티켓팅 폴더</a></div>
    <h1>CS 티켓팅·응대 관리 시스템 — 시안 B</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 칸반 보드형(팀장·매니저용)</h4>
      <ul><li>컬럼 = 처리 단계, 카드 = 티켓 — 여러 상담사가 함께 일하는 팀 전체 현황을 한눈에 관리</li><li>카드를 다음 단계로 옮기고, 카드를 열면 상세에서 담당자·우선순위를 바로 변경</li></ul>
    </div>

    <div class="page-title-row"><h2>티켓 보드</h2><a href="./variant-b-new.html" class="btn-primary btn-sm">+ 새 티켓 등록</a></div>
    <div class="kanban-board" id="board"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '04b';
  const SEED = [
    { key:'new', label:'신규', tickets:[
      { id:'k1', name:'배송 지연 문의', meta:'김하나 · 5분 전' },
      { id:'k2', name:'제품 파손 신고', meta:'한지민 · 20분 전' },
    ]},
    { key:'progress', label:'처리중', tickets:[
      { id:'k3', name:'환불 요청', meta:'이도윤 · 1시간 전' },
    ]},
    { key:'waiting', label:'고객 확인 대기', tickets:[
      { id:'k4', name:'교환 배송지 확인 요청', meta:'박준서 · 3시간 전' },
    ]},
    { key:'done', label:'완료', tickets:[
      { id:'k5', name:'제품 사용법 문의', meta:'최서연 · 어제' },
    ]},
  ];
  function loadBoard() {
    let cols = sgGetJSON('sg-board-' + NS, null);
    if (!cols) { cols = SEED; sgSetJSON('sg-board-' + NS, cols); }
    return cols;
  }
  function saveBoard(cols) { sgSetJSON('sg-board-' + NS, cols); }
  let cols = loadBoard();

  function render() {
    document.getElementById('board').innerHTML = cols.map((col, ci) => (
      '<div class="kanban-col"><div class="kanban-col-head">' + col.label + ' <span class="count">' + col.tickets.length + '</span></div><div class="kanban-col-body">' +
      col.tickets.map((t) => (
        '<div class="kanban-card"><div class="name" style="cursor:pointer" onclick="location.href=\'./variant-b-detail.html?id=' + t.id + '\'">' + t.name + '</div><div class="meta">' + t.meta + '</div><div class="move-row">' +
        (ci > 0 ? '<button onclick="move(\'' + t.id + '\',-1)">‹</button>' : '') +
        (ci < cols.length - 1 ? '<button onclick="move(\'' + t.id + '\',1)">›</button>' : '') +
        '</div></div>'
      )).join('') +
      '</div></div>'
    )).join('');
  }
  function move(id, dir) {
    const ci = cols.findIndex((c) => c.tickets.some((t) => t.id === id));
    const ti = cols[ci].tickets.findIndex((t) => t.id === id);
    const target = ci + dir;
    if (target < 0 || target >= cols.length) return;
    const [ticket] = cols[ci].tickets.splice(ti, 1);
    cols[target].tickets.push(ticket);
    saveBoard(cols);
    render();
  }
  render();
</script>
</body>
</html>
