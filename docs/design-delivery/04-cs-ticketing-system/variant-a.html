<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CS 티켓팅 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">CS 티켓팅 폴더</a></div>
    <h1>CS 티켓팅·응대 관리 시스템 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 목록+상세 분할형(상담사용)</h4>
      <ul><li>이메일 클라이언트와 같은 목록+상세 분할 — 하루 종일 여러 티켓을 넘겨가며 처리하는 CS 상담사에게 가장 빠른 패턴</li><li>티켓을 눌러 우측에서 바로 확인·답변하고, 답변을 발송하면 상태가 "답변완료"로 전환</li></ul>
    </div>

    <div class="detail-grid" style="grid-template-columns:280px 1fr">
      <div class="glass-panel" style="padding:8px" id="ticket-list"></div>
      <div class="glass-panel" id="ticket-detail"></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '04a';
  const SEED = [
    { id:'t1', subject:'배송 지연 문의', customer:'김하나', time:'5분 전', status:'신규', body:'주문한 지 5일이 지났는데 아직 배송 시작 전이라고 나옵니다. 확인 부탁드려요.', replies:[] },
    { id:'t2', subject:'환불 요청', customer:'이도윤', time:'1시간 전', status:'처리중', body:'단순 변심으로 환불하고 싶습니다. 절차가 어떻게 되나요?', replies:['환불 접수되었습니다. 3영업일 내 처리 예정입니다.'] },
    { id:'t3', subject:'제품 사용법 문의', customer:'최서연', time:'어제', status:'답변완료', body:'제품 사용법을 문의드립니다.', replies:['사용 설명서를 이메일로 보내드렸습니다.'] },
  ];
  function loadTickets() {
    let list = sgGetJSON('sg-tickets-' + NS, null);
    if (!list) { list = SEED; sgSetJSON('sg-tickets-' + NS, list); }
    return list;
  }
  function saveTickets(list) { sgSetJSON('sg-tickets-' + NS, list); }
  let tickets = loadTickets();
  let selectedId = tickets[0].id;

  function statusChip(s) { return s === '답변완료' ? 'chip-success' : s === '처리중' ? 'chip-warn' : 'chip-info'; }

  function renderList() {
    document.getElementById('ticket-list').innerHTML = tickets.map((t) => (
      '<div style="padding:10px 12px;border-bottom:1px solid var(--hairline);cursor:pointer;border-radius:8px;' + (t.id === selectedId ? 'background:rgba(109,93,254,.06)' : '') + '" onclick="selectTicket(\'' + t.id + '\')">' +
      '<b style="font-size:12.5px">' + t.subject + '</b> <span class="chip ' + statusChip(t.status) + '" style="margin-left:4px">' + t.status + '</span>' +
      '<div style="font-size:11px;color:var(--slate-400);margin-top:2px">' + t.customer + ' · ' + t.time + '</div></div>'
    )).join('');
  }
  function renderDetail() {
    const t = tickets.find((x) => x.id === selectedId);
    document.getElementById('ticket-detail').innerHTML =
      '<div class="panel-head"><div><h3>' + t.subject + ' <span class="chip ' + statusChip(t.status) + '" style="margin-left:6px">' + t.status + '</span></h3><p>' + t.customer + ' · #' + t.id.toUpperCase() + '</p></div>' +
      '<a class="btn-outline btn-sm" href="./variant-a-customer.html?name=' + encodeURIComponent(t.customer) + '">고객 히스토리</a></div>' +
      '<p style="font-size:13px;color:var(--slate-700);margin-bottom:12px">' + t.body + '</p>' +
      (t.replies.length ? '<div class="glass-card" style="margin-bottom:12px;background:var(--surface-2)"><b style="font-size:11.5px;color:var(--slate-500)">이전 답변</b><p style="font-size:12.5px;margin:4px 0 0">' + t.replies[t.replies.length - 1] + '</p></div>' : '') +
      '<div class="field"><textarea id="reply-input" rows="3" placeholder="답변 작성"></textarea></div>' +
      '<button class="btn-primary btn-sm" onclick="sendReply()">답변 발송</button>';
  }
  function selectTicket(id) { selectedId = id; renderList(); renderDetail(); }
  function sendReply() {
    const input = document.getElementById('reply-input');
    const text = input.value.trim();
    if (!text) { showSnack('warning', '답변 내용을 입력해주세요.'); return; }
    const t = tickets.find((x) => x.id === selectedId);
    t.replies.push(text);
    t.status = '답변완료';
    saveTickets(tickets);
    renderList();
    renderDetail();
    showSnack('success', '답변이 발송되었습니다.');
  }
  renderList();
  renderDetail();
</script>
</body>
</html>
