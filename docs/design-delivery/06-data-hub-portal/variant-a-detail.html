<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데이터셋 상세 — 데이터 허브 포털 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">데이터 허브 포털 폴더</a> · <a href="./variant-a.html">시안 A 홈</a></div>
    <h1 id="ds-title">데이터셋 상세 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="page-title-row">
      <span class="chip" id="ds-score-chip"></span>
      <button type="button" class="btn-primary btn-sm" id="access-btn" onclick="requestAccess()">🔑 접근 신청</button>
    </div>
    <div class="glass-panel kv-list">
      <div class="kv-row"><span class="k">소유 부서</span><span class="v" id="ds-dept"></span></div>
      <div class="kv-row"><span class="k">갱신 주기</span><span class="v" id="ds-freq"></span></div>
      <div class="kv-row"><span class="k">설명</span><span class="v" id="ds-desc"></span></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '06a';
  const DATASETS = {
    ds1:{ name:'고객 주문 이력', dept:'영업', score:98, freq:'매일', desc:'전사 주문 트랜잭션 원장 테이블' },
    ds2:{ name:'캠페인 클릭 로그', dept:'마케팅', score:76, freq:'매시간', desc:'광고 캠페인별 클릭·전환 이벤트 로그' },
    ds3:{ name:'CS 문의 원문', dept:'CS', score:91, freq:'실시간', desc:'고객 문의 티켓 원문 텍스트' },
    ds4:{ name:'디바이스 원격 로그', dept:'운영', score:54, freq:'매일', desc:'IoT 디바이스 원격 상태 로그(정제 필요)' },
  };
  const id = new URLSearchParams(window.location.search).get('id') || 'ds1';
  const d = DATASETS[id] || DATASETS.ds1;
  document.title = d.name + ' — 시안 A';
  document.getElementById('ds-title').textContent = d.name;
  document.getElementById('ds-score-chip').className = 'chip ' + (d.score >= 90 ? 'chip-success' : d.score >= 70 ? 'chip-warn' : 'chip-error');
  document.getElementById('ds-score-chip').textContent = '품질 ' + d.score + '점';
  document.getElementById('ds-dept').textContent = d.dept;
  document.getElementById('ds-freq').textContent = d.freq;
  document.getElementById('ds-desc').textContent = d.desc;

  function render() {
    const requested = sgGetJSON(NS + '-access-' + id, false);
    const btn = document.getElementById('access-btn');
    if (requested) { btn.textContent = '신청 완료'; btn.disabled = true; btn.className = 'btn-outline btn-sm'; }
  }
  function requestAccess() {
    sgSetJSON(NS + '-access-' + id, true);
    render();
    showSnack('success', '접근 권한을 신청했습니다. 승인 시 알림을 드립니다.');
  }
  render();
</script>
</body>
</html>
