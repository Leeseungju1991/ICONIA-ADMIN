<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데이터 허브 포털 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">데이터 허브 포털 폴더</a></div>
    <h1>사내 데이터 허브·정제 관리 포털 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 품질 점수·정합성 체크리스트형(거버넌스 담당자용)</h4>
      <ul><li>데이터 자체보다 "품질이 괜찮은지"가 우선 관심사인 데이터 거버넌스 담당자용 체크리스트+지표 조합</li><li>이슈 데이터셋을 눌러 정합성 검사 항목을 하나씩 해결 처리</li></ul>
    </div>

    <div class="grid" style="margin-bottom:16px" id="stat-grid"></div>

    <div class="u-label">품질 이슈 데이터셋</div>
    <div class="glass-panel" id="issue-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '06c';
  const DATASETS = [
    { id:'ds1', name:'고객 주문 이력', score:98, checks:[] },
    { id:'ds2', name:'캠페인 클릭 로그', score:76, checks:['이상치 값 수동 검토 필요'] },
    { id:'ds4', name:'디바이스 원격 로그', score:54, checks:['중복 레코드 5,200건 발견','타임스탬프 형식 불일치 구간 존재','이상치 값 수동 검토 필요'] },
  ];
  function getDone(id, total) { return sgGetJSON(NS + '-checks-' + id, new Array(total).fill(false)); }
  function unresolvedCount(d) { return getDone(d.id, d.checks.length).filter((x) => !x).length; }

  function render() {
    const issueDatasets = DATASETS.filter((d) => unresolvedCount(d) > 0);
    document.getElementById('stat-grid').innerHTML =
      '<div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">평균 품질 점수</div><div class="value">82점</div></div>' +
      '<div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#f43f5e,transparent)"></div><div class="label">품질 이슈 데이터셋</div><div class="value">' + issueDatasets.length + '건</div></div>' +
      '<div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#059669,transparent)"></div><div class="label">정합성 통과율</div><div class="value">94%</div></div>';
    document.getElementById('issue-list').innerHTML = issueDatasets.length ? issueDatasets.map((d, i) => (
      '<a href="./variant-c-detail.html?id=' + d.id + '" style="text-decoration:none;color:inherit;display:block;padding:12px 0;' + (i < issueDatasets.length - 1 ? 'border-bottom:1px solid var(--hairline)' : '') + '">' +
      '<b style="font-size:13px">' + d.name + '</b> <span class="chip chip-error" style="margin-left:6px">미해결 ' + unresolvedCount(d) + '건</span></a>'
    )).join('') : '<div class="state-box">모든 데이터셋의 정합성 이슈가 해결되었습니다.</div>';
  }
  render();
</script>
</body>
</html>
