<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데이터 허브 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">데이터 허브 포털 폴더</a></div>
    <h1>사내 데이터 허브·정제 관리 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 카탈로그 검색표형(분석가용)</h4>
      <ul><li>데이터 분석가가 "어떤 데이터가 있는지" 탐색하는 카탈로그형 — 검색+표가 가장 빠른 진입</li><li>검색·부서 필터로 원하는 데이터셋을 좁히고, 행을 누르면 상세로 이동</li></ul>
    </div>

    <div class="page-toolbar">
      <div class="input-wrap grow"><input class="input" id="q-input" placeholder="데이터셋 검색" oninput="renderTable()" style="padding-right:34px" /><button type="button" class="clear-btn" onclick="clearSearch(this)">✕</button></div>
      <div class="dropdown"><button class="btn-outline btn-sm" onclick="toggleDropdown(event,this)">소유 부서 ▾</button>
        <div class="dropdown-menu" hidden>
          <button class="item" onclick="setDept('');closeDropdown()">전체</button>
          <button class="item" onclick="setDept('영업');closeDropdown()">영업</button>
          <button class="item" onclick="setDept('마케팅');closeDropdown()">마케팅</button>
          <button class="item" onclick="setDept('CS');closeDropdown()">CS</button>
          <button class="item" onclick="setDept('운영');closeDropdown()">운영</button>
        </div>
      </div>
    </div>

    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>데이터셋</th><th>소유 부서</th><th>품질 점수</th><th>갱신 주기</th></tr></thead>
      <tbody id="ds-tbody"></tbody>
    </table></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const DATASETS = [
    { id:'ds1', name:'고객 주문 이력', dept:'영업', score:98, freq:'매일' },
    { id:'ds2', name:'캠페인 클릭 로그', dept:'마케팅', score:76, freq:'매시간' },
    { id:'ds3', name:'CS 문의 원문', dept:'CS', score:91, freq:'실시간' },
    { id:'ds4', name:'디바이스 원격 로그', dept:'운영', score:54, freq:'매일' },
  ];
  let deptFilter = '';
  function setDept(d) { deptFilter = d; renderTable(); }
  function scoreChip(s) { return s >= 90 ? 'chip-success' : s >= 70 ? 'chip-warn' : 'chip-error'; }
  function renderTable() {
    const q = document.getElementById('q-input').value.trim().toLowerCase();
    const items = DATASETS.filter((d) => (!q || d.name.toLowerCase().includes(q)) && (!deptFilter || d.dept === deptFilter));
    document.getElementById('ds-tbody').innerHTML = items.length ? items.map((d) => (
      '<tr style="cursor:pointer" onclick="location.href=\'./variant-a-detail.html?id=' + d.id + '\'"><td>' + d.name + '</td><td>' + d.dept + '</td><td><span class="chip ' + scoreChip(d.score) + '">' + d.score + '점</span></td><td>' + d.freq + '</td></tr>'
    )).join('') : '<tr><td colspan="4"><div class="state-box">검색 결과가 없습니다.</div></td></tr>';
  }
  renderTable();
</script>
</body>
</html>
