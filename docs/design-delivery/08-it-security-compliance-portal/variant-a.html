<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IT·보안 컴플라이언스 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">IT·보안 컴플라이언스 포털 폴더</a></div>
    <h1>IT 서비스·보안 컴플라이언스 체크리스트 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 실행형 체크리스트(점검·감사 실무자용)</h4>
      <ul><li>점검·감사 실무자가 "오늘 뭘 확인해야 하는지" 순서대로 처리하는 실행형 체크리스트</li><li>항목을 누르면 완료/미완료가 실제로 전환되어 저장되고, 코멘트를 남길 수 있습니다</li></ul>
    </div>

    <div class="page-title-row"><h2>2026년 3분기 보안 점검</h2><span class="chip chip-warn" id="progress-chip"></span></div>
    <div class="progress-track" style="height:10px;margin-bottom:16px"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="glass-panel" id="check-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '08a';
  const ITEMS = [
    { id:'c1', label:'전 직원 비밀번호 정책 준수 점검', owner:'IT팀', done:true },
    { id:'c2', label:'퇴사자 계정 회수 여부 확인', owner:'IT팀', done:true },
    { id:'c3', label:'2FA 미적용 계정 조치', owner:'보안팀', done:true },
    { id:'c4', label:'외부 접속 VPN 로그 이상 여부', owner:'보안팀', done:false },
    { id:'c5', label:'협력사 접근권한 재검토', owner:'IT팀', done:false },
    { id:'c6', label:'백업 복구 테스트', owner:'인프라팀', done:false },
  ];
  function getState(id, def) { return sgGetJSON(NS + '-' + id, def); }
  function render() {
    const doneCount = ITEMS.filter((it) => getState(it.id, it.done)).length;
    document.getElementById('progress-chip').textContent = doneCount + '/' + ITEMS.length + ' 완료';
    document.getElementById('progress-fill').style.width = Math.round((doneCount / ITEMS.length) * 100) + '%';
    document.getElementById('check-list').innerHTML = ITEMS.map((it) => {
      const done = getState(it.id, it.done);
      const hasComment = !!sgGetJSON(NS + '-comment-' + it.id, '');
      return '<div class="checklist-item"><span class="status-icon ' + (done ? 'pass' : 'pending') + '" style="cursor:pointer" onclick="toggle(\'' + it.id + '\')">' + (done ? '✓' : '?') + '</span>' +
        '<span class="label">' + it.label + (hasComment ? ' 💬' : '') + '</span><span class="owner">' + it.owner + '</span>' +
        '<a class="btn-ghost btn-xs" href="./variant-a-detail.html?id=' + it.id + '">코멘트</a></div>';
    }).join('');
  }
  function toggle(id) {
    const item = ITEMS.find((x) => x.id === id);
    const cur = getState(id, item.done);
    sgSetJSON(NS + '-' + id, !cur);
    render();
  }
  render();
</script>
</body>
</html>
