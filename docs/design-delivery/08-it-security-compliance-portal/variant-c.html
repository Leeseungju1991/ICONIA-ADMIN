<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IT·보안 컴플라이언스 포털 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">IT·보안 컴플라이언스 포털 폴더</a></div>
    <h1>IT 서비스·보안 컴플라이언스 체크리스트 포털 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 감사 증적 관리 표형</h4>
      <ul><li>외부 감사 대응처럼 "증거 자료가 있는지"가 핵심인 상황을 위한 감사증적 표 레이아웃</li><li>항목을 눌러 증적을 실제로 등록하면 상태가 "완료"로 바뀌어 저장됩니다</li></ul>
    </div>

    <div class="page-title-row"><h2>감사 증적 관리</h2><button class="btn-outline btn-sm" onclick="showSnack('success','감사 리포트를 내보냅니다.')">감사 리포트 내보내기</button></div>

    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>점검 항목</th><th>최근 점검일</th><th>증적 파일</th><th>상태</th></tr></thead>
      <tbody id="audit-tbody"></tbody>
    </table></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '08c';
  const ITEMS = [
    { id:'a1', label:'비밀번호 정책 준수', date:'2026-09-20', file:'password-audit-q3.pdf', status:'완료' },
    { id:'a2', label:'2FA 적용 현황', date:'2026-09-18', file:'2fa-status-q3.xlsx', status:'완료' },
    { id:'a3', label:'VPN 접속 로그 검토', date:'—', file:null, status:'미제출' },
    { id:'a4', label:'협력사 접근권한 재검토', date:'2026-08-30', file:'vendor-access-q2.pdf', status:'보완 필요' },
  ];
  function statusChip(s) { return s === '완료' ? 'chip-success' : s === '보완 필요' ? 'chip-warn' : 'chip-error'; }
  function render() {
    document.getElementById('audit-tbody').innerHTML = ITEMS.map((it) => {
      const uploaded = sgGetJSON(NS + '-file-' + it.id, null);
      const status = uploaded ? '완료' : it.status;
      const file = uploaded || it.file;
      return '<tr style="cursor:pointer" onclick="location.href=\'./variant-c-detail.html?id=' + it.id + '\'"><td>' + it.label + '</td><td>' + (uploaded ? '오늘' : it.date) + '</td><td>' + (file ? '<span style="color:var(--accent)">' + file + '</span>' : '—') + '</td><td><span class="chip ' + statusChip(status) + '">' + status + '</span></td></tr>';
    }).join('');
  }
  render();
</script>
</body>
</html>
