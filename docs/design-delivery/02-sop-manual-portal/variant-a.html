<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOP·매뉴얼 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">SOP·매뉴얼 포털 폴더</a></div>
    <h1>표준 업무 절차(SOP) · 매뉴얼 공유 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 부서별 문서함 탐색형</h4>
      <ul><li>처음 오는 사람도 "어디부터 볼지" 헷갈리지 않도록 부서 카드를 큰 진입점으로 배치</li><li>카드를 누르면 아래 표가 그 부서 문서로 실제 전환되고, 문서를 누르면 상세 페이지로 이동합니다</li></ul>
    </div>

    <div class="grid" id="dept-cards"></div>

    <div class="glass-panel" style="margin-top:16px">
      <div class="panel-head"><div><h3 id="dept-title">영업·CS — 최근 갱신 문서</h3></div></div>
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>문서명</th><th>버전</th><th>갱신일</th><th>승인 상태</th></tr></thead>
        <tbody id="dept-tbody"></tbody>
      </table></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const DEPTS = [
    { key:'sales', label:'영업·CS', docs:[
      { id:'p1', title:'CS 응대 표준 스크립트', ver:'v3.2', date:'오늘', status:'승인됨' },
      { id:'p2', title:'반품·교환 처리 절차', ver:'v2.0', date:'3일 전', status:'검토중' },
    ]},
    { key:'hr', label:'인사·총무', docs:[
      { id:'p3', title:'신규 입사자 온보딩 절차', ver:'v1.4', date:'1주 전', status:'승인됨' },
      { id:'p4', title:'연차·경조사 신청 매뉴얼', ver:'v2.1', date:'2주 전', status:'승인됨' },
    ]},
    { key:'it', label:'IT·보안', docs:[
      { id:'p5', title:'사내 계정 발급 절차', ver:'v1.0', date:'1주 전', status:'승인됨' },
      { id:'p6', title:'보안 사고 대응 매뉴얼', ver:'v3.0', date:'어제', status:'검토중' },
    ]},
    { key:'ops', label:'생산·물류', docs:[
      { id:'p7', title:'출고 검수 표준 절차', ver:'v2.2', date:'2주 전', status:'승인됨' },
    ]},
  ];
  function statusChip(s) { return s === '승인됨' ? 'chip-success' : s === '검토중' ? 'chip-warn' : 'chip-muted'; }
  function renderDept(key) {
    const dept = DEPTS.find((d) => d.key === key);
    document.getElementById('dept-title').textContent = dept.label + ' — 최근 갱신 문서';
    document.getElementById('dept-tbody').innerHTML = dept.docs.map((d) => (
      '<tr style="cursor:pointer" onclick="location.href=\'./variant-a-detail.html?id=' + d.id + '\'"><td>' + d.title + '</td><td>' + d.ver + '</td><td>' + d.date + '</td><td><span class="chip ' + statusChip(d.status) + '">' + d.status + '</span></td></tr>'
    )).join('');
  }
  document.getElementById('dept-cards').innerHTML = DEPTS.map((d, i) => (
    '<div class="pick-card" data-selected="' + (i === 0) + '" onclick="selectDept(this,\'' + d.key + '\')"><span class="check">✓</span><b>' + d.label + '</b><div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">SOP ' + d.docs.length + '건</div></div>'
  )).join('');
  function selectDept(el, key) {
    selectOnlyCard(el);
    renderDept(key);
  }
  renderDept('sales');
</script>
</body>
</html>
