<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOP·매뉴얼 포털 — 시안 B</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">SOP·매뉴얼 포털 폴더</a></div>
    <h1>표준 업무 절차(SOP) · 매뉴얼 공유 포털 — 시안 B</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 문서상세·개정관리형</h4>
      <ul><li>문서 본문·버전이력·승인상태를 탭으로 분리해 한 화면에서 확인</li><li>문서에 이상이 있으면 "개정 요청"을 접수할 수 있고, 접수 내역은 해당 문서의 승인상태 탭에서 바로 확인</li></ul>
    </div>

    <div class="page-toolbar">
      <div class="input-wrap grow"><input class="input" id="q-input" placeholder="문서명으로 검색" oninput="renderList()" /></div>
    </div>
    <div class="glass-panel" id="doc-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const DOCS = [
    { id:'p1', title:'CS 응대 표준 스크립트', dept:'영업·CS', ver:'v3.2', status:'승인됨' },
    { id:'p2', title:'반품·교환 처리 절차', dept:'영업·CS', ver:'v2.0', status:'검토중' },
    { id:'p3', title:'신규 입사자 온보딩 절차', dept:'인사·총무', ver:'v1.4', status:'승인됨' },
    { id:'p4', title:'연차·경조사 신청 매뉴얼', dept:'인사·총무', ver:'v2.1', status:'승인됨' },
    { id:'p5', title:'사내 계정 발급 절차', dept:'IT·보안', ver:'v1.0', status:'승인됨' },
    { id:'p6', title:'보안 사고 대응 매뉴얼', dept:'IT·보안', ver:'v3.0', status:'검토중' },
    { id:'p7', title:'출고 검수 표준 절차', dept:'생산·물류', ver:'v2.2', status:'승인됨' },
  ];
  function renderList() {
    const q = document.getElementById('q-input').value.trim().toLowerCase();
    const items = DOCS.filter((d) => !q || d.title.toLowerCase().includes(q));
    document.getElementById('doc-list').innerHTML = items.length ? items.map((d, i) => (
      '<a href="./variant-b-detail.html?id=' + d.id + '" style="text-decoration:none;color:inherit;display:block;padding:12px 0;' + (i < items.length - 1 ? 'border-bottom:1px solid var(--hairline)' : '') + '">' +
      '<b style="font-size:13px">' + d.title + '</b> <span class="chip chip-muted" style="margin-left:6px">' + d.dept + '</span> <span class="chip ' + (d.status === '승인됨' ? 'chip-success' : 'chip-warn') + '">' + d.status + '</span>' +
      '<div style="font-size:12px;color:var(--slate-500);margin-top:4px">' + d.ver + '</div></a>'
    )).join('') : '<div class="state-box">검색 결과가 없습니다.</div>';
  }
  renderList();
</script>
</body>
</html>
