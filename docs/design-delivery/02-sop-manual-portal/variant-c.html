<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOP·매뉴얼 포털 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">SOP·매뉴얼 포털 폴더</a></div>
    <h1>표준 업무 절차(SOP) · 매뉴얼 공유 포털 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 절차 실행·체크리스트형</h4>
      <ul><li>문서를 읽는 화면이 아니라 "지금 실제로 이 절차를 수행 중"인 사람을 위한 실행형 레이아웃</li><li>단계를 체크하면 진행률이 실시간으로 갱신되고 저장되어, 나중에 다시 와도 이어서 진행할 수 있습니다</li></ul>
    </div>

    <div class="page-title-row"><h2 style="margin:0">내가 수행 중인 절차</h2></div>
    <div class="grid" id="proc-grid"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '02c';
  const PROCS = [
    { id:'proc1', title:'신규 입사자 온보딩 절차', steps:6 },
    { id:'proc2', title:'보안 사고 대응 절차', steps:4 },
    { id:'proc3', title:'출고 검수 절차', steps:3 },
  ];
  function getProgress(procId, total) {
    const done = sgGetJSON('sg-checklist-' + NS + '-' + procId, []);
    const count = done.filter(Boolean).length;
    return { count, total, pct: Math.round((count / total) * 100) };
  }
  document.getElementById('proc-grid').innerHTML = PROCS.map((p) => {
    const prog = getProgress(p.id, p.steps);
    return '<a href="./variant-c-run.html?id=' + p.id + '" style="text-decoration:none;color:inherit"><div class="glass-card">' +
      '<b style="font-size:13px">' + p.title + '</b>' +
      '<div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:' + prog.pct + '%"></div></div>' +
      '<div style="font-size:11.5px;color:var(--slate-500);margin-top:6px">' + prog.count + '/' + prog.total + ' 완료 (' + prog.pct + '%)' + (prog.pct === 100 ? ' <span class="chip chip-success">완료</span>' : '') + '</div>' +
      '</div></a>';
  }).join('');
</script>
</body>
</html>
