<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>문서상세 — SOP·매뉴얼 포털 시안 B</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">SOP·매뉴얼 포털 폴더</a> · <a href="./variant-b.html">시안 B 홈</a></div>
    <h1 id="doc-title">문서 상세 — 시안 B</h1>
  </header>

  <div class="page-frame">
    <div class="page-title-row"><h2 id="doc-title2" style="margin:0"></h2><a class="btn-outline btn-sm" id="revise-link" href="#">개정 요청</a></div>

    <div class="tabs" role="tablist" style="margin-bottom:14px">
      <button class="tab" role="tab" aria-selected="true" onclick="switchTab(this,'body')">본문</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'hist')">버전 이력</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'approve')">승인 상태</button>
    </div>

    <div class="tab-panel" data-panel="body">
      <div class="glass-panel"><p id="doc-body" style="font-size:13px;color:var(--slate-700);line-height:1.7"></p></div>
    </div>
    <div class="tab-panel" data-panel="hist" hidden>
      <div class="expand-row"><div class="head"><div>v3.2 — 2026-09-27 · 김민지</div><button class="toggle-btn" onclick="toggleAccordion(this)">펼침</button></div><div class="detail" hidden>최신 버전 개정 사항</div></div>
      <div class="expand-row"><div class="head"><div>v3.1 — 2026-07-10 · 박서준</div><button class="toggle-btn" onclick="toggleAccordion(this)">펼침</button></div><div class="detail" hidden>이전 버전 개정 사항</div></div>
    </div>
    <div class="tab-panel" data-panel="approve" hidden>
      <div class="glass-panel kv-list" style="margin-bottom:12px">
        <div class="kv-row"><span class="k">작성자</span><span class="v">김민지</span></div>
        <div class="kv-row"><span class="k">승인자</span><span class="v">이하늘</span></div>
      </div>
      <div class="u-label">개정 요청 내역</div>
      <div id="revision-list"></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '02b';
  const DOCS = {
    p1:{ title:'CS 응대 표준 스크립트', body:'1. 고객 응대 시 반드시 본인 소속과 이름을 먼저 밝힌다.<br/>2. 고객의 문의를 끝까지 경청한 뒤 요약해 재확인한다.<br/>3. 해결 불가한 문의는 담당 부서로 즉시 이관한다.' },
    p2:{ title:'반품·교환 처리 절차', body:'반품 접수 후 3영업일 이내 상태 확인, 검수 통과 시 환불 또는 교환을 진행한다.' },
    p3:{ title:'신규 입사자 온보딩 절차', body:'계정 발급 → 서류 제출 → 필수 교육 → 부서 배치 → 장비 수령 → 수습 평가 순으로 진행한다.' },
    p4:{ title:'연차·경조사 신청 매뉴얼', body:'연차는 HRIS에서, 경조사는 경조사 신청서 양식을 작성해 인사팀에 제출한다.' },
    p5:{ title:'사내 계정 발급 절차', body:'입사 확정 통보 즉시 IT팀에 계정 발급을 요청하며, 입사 1일 전까지 발급을 완료한다.' },
    p6:{ title:'보안 사고 대응 매뉴얼', body:'사고 인지 즉시 보안팀에 신고하고, 영향받는 계정의 비밀번호를 즉시 변경한다.' },
    p7:{ title:'출고 검수 표준 절차', body:'출고 전 수량·포장 상태를 검수 체크리스트에 따라 확인 후 서명한다.' },
  };
  const id = new URLSearchParams(window.location.search).get('id') || 'p1';
  const doc = DOCS[id] || DOCS.p1;
  document.title = doc.title + ' — 시안 B';
  document.getElementById('doc-title').textContent = doc.title;
  document.getElementById('doc-title2').textContent = doc.title;
  document.getElementById('doc-body').innerHTML = doc.body;
  document.getElementById('revise-link').href = './variant-b-revise.html?id=' + id;

  function renderRevisions() {
    const all = sgGetJSON('sg-revisions-' + NS, []);
    const mine = all.filter((r) => r.docId === id);
    document.getElementById('revision-list').innerHTML = mine.length ? mine.map((r) => (
      '<div class="glass-card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">' + r.requester + '</b><span class="chip chip-warn">' + r.status + '</span></div><div style="font-size:12px;color:var(--slate-600);margin-top:4px">' + r.reason + '</div><div style="font-size:11px;color:var(--slate-400);margin-top:4px">' + new Date(r.ts).toLocaleString('ko-KR') + '</div></div>'
    )).join('') : '<div class="state-box">접수된 개정 요청이 없습니다.</div>';
  }
  renderRevisions();
</script>
</body>
</html>
