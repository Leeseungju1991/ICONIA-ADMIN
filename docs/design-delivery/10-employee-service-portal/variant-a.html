<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>임직원 서비스 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">임직원 서비스 포털 폴더</a></div>
    <h1>사내 통합 임직원 서비스 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 서비스 타일 그리드형(전 직원 진입점)</h4>
      <ul><li>전 직원이 매일 들어오는 진입점 — 아이콘 타일 그리드로 "어디서 뭘 신청하는지" 직관적으로</li><li>타일을 누르면 서비스 상세에서 바로 신청</li></ul>
    </div>

    <div class="banner info" style="margin-bottom:16px"><span class="icon">📢</span><div><p class="title">10월 정기 건강검진 신청 안내</p><p class="desc">10/15까지 사내 포털에서 신청해주세요.</p></div></div>

    <div class="grid" id="tile-grid"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '10a';
  const SERVICES = [
    { id:'svc1', icon:'👤', name:'인사·근태', desc:'연차·재직증명·급여명세서' },
    { id:'svc2', icon:'💻', name:'IT 지원', desc:'장비 신청·계정 발급·장애 접수' },
    { id:'svc3', icon:'🏢', name:'총무·시설', desc:'회의실 예약·비품 신청' },
    { id:'svc4', icon:'💳', name:'경비 정산', desc:'법인카드·출장비 정산' },
    { id:'svc5', icon:'📚', name:'사내 교육', desc:'필수 교육·신청 강의' },
    { id:'svc6', icon:'❓', name:'문의하기', desc:'부서별 담당자 찾기' },
  ];
  document.getElementById('tile-grid').innerHTML = SERVICES.map((s) => {
    const applied = sgGetJSON(NS + '-applied-' + s.id, false);
    return '<a href="./variant-a-detail.html?id=' + s.id + '" class="text-plain"><div class="pick-card" data-selected="false"><b>' + s.icon + ' ' + s.name + '</b>' + (applied ? ' <span class="chip chip-success">신청됨</span>' : '') + '<div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">' + s.desc + '</div></div></a>';
  }).join('');
</script>
</body>
</html>
