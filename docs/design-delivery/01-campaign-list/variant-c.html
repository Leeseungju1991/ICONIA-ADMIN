<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캠페인 목록 — 시안 C (타임라인형)</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>
  .tl-row { display:grid; grid-template-columns:160px 1fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline); }
  .tl-row:last-child { border-bottom:none; }
  .tl-name { font-size:12.5px; font-weight:600; }
  .tl-name .ch { display:block; font-size:10.5px; color:var(--slate-400); font-weight:400; margin-top:2px; }
  .tl-track { position:relative; height:20px; background:var(--surface-3); border-radius:999px; }
  .tl-bar { position:absolute; top:2px; height:16px; border-radius:999px; }
  .tl-axis { display:grid; grid-template-columns:160px 1fr; gap:12px; margin-bottom:8px; }
  .tl-axis-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--slate-400); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">캠페인 목록 폴더</a></div>
    <h1>캠페인 목록 — 시안 C</h1>
    <p>일정 타임라인형 레이아웃. 여러 캠페인의 기간이 겹치는지, 언제 몰려 있는지를 한눈에 보고 싶을 때.</p>
  </header>

  <div class="page-frame">
    <div class="page-title-row"><h2>캠페인 일정</h2><span class="chip chip-muted">9월</span></div>

    <div class="glass-panel">
      <div class="tl-axis"><div></div><div class="tl-axis-labels"><span>09.01</span><span>09.10</span><span>09.20</span><span>09.30</span></div></div>

      <div class="tl-row">
        <div class="tl-name">9월 신규가입 프로모션<span class="ch">이메일</span></div>
        <div class="tl-track"><div class="tl-bar" style="left:0%;width:100%;background:var(--accent)"></div></div>
      </div>
      <div class="tl-row">
        <div class="tl-name">추석 연휴 알림톡<span class="ch">카카오</span></div>
        <div class="tl-track"><div class="tl-bar" style="left:63%;width:30%;background:#EC4899"></div></div>
      </div>
      <div class="tl-row">
        <div class="tl-name">리텐션 푸시 A/B<span class="ch">앱 푸시</span></div>
        <div class="tl-track"><div class="tl-bar" style="left:100%;width:0%;background:#60A5FA;opacity:.3"></div></div>
      </div>
      <div class="tl-row">
        <div class="tl-name">8월 여름 세일<span class="ch">이메일</span></div>
        <div class="tl-track"><div class="tl-bar" style="left:-100%;width:100%;background:var(--slate-300)"></div></div>
      </div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">이번 주 겹치는 캠페인</div><div class="value">2건</div><div class="delta"><span class="flat">09.20–09.29 구간</span></div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#14B8A6,transparent)"></div><div class="label">공백 기간</div><div class="value">없음</div><div class="delta"><span class="up">전 기간 커버</span></div></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
