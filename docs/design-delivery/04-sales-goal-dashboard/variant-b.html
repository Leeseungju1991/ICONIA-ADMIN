<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>영업 목표 현황 — 시안 B (팀 비교)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">영업 목표 현황 폴더</a></div>
    <h1>영업 목표 현황 — 시안 B</h1>
    <p>팀 전체 목표와 팀원별 순위를 함께 보여주는 레이아웃. 팀장이 주간 회의에서 그대로 띄워놓고 보는 화면.</p>
  </header>

  <div class="page-frame">
    <div class="glass-panel" style="margin-bottom:16px">
      <div class="panel-head"><div><h3>영업 1팀 · 이번 분기 목표</h3><p>팀 목표 8억원 중 진행률</p></div><span class="chip chip-warn">약간 지연</span></div>
      <div class="progress-track" style="height:12px;margin-bottom:8px"><div class="progress-fill" style="width:52%"></div></div>
      <div class="row" style="justify-content:space-between"><span style="font-size:12.5px;color:var(--slate-600)">4억 1,600만원 달성</span><span style="font-size:12.5px;font-weight:700">52%</span></div>
    </div>

    <div class="glass-panel">
      <div class="panel-head"><div><h3>팀원별 순위</h3></div><button class="btn-link">전체 팀 보기 →</button></div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>순위</th><th>이름</th><th>목표 대비 달성률</th><th>이번달 매출</th></tr></thead>
          <tbody>
            <tr><td>🥇 1</td><td>정영업</td><td><span class="chip chip-success">104%</span></td><td>6,800만원</td></tr>
            <tr><td>🥈 2</td><td>박영업</td><td><span class="chip chip-success">91%</span></td><td>5,240만원</td></tr>
            <tr><td>🥉 3</td><td>한영업</td><td><span class="chip chip-warn">68%</span></td><td>3,900만원</td></tr>
            <tr><td>4</td><td>오영업</td><td><span class="chip chip-error">42%</span></td><td>2,100만원</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
