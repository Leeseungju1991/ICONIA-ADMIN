<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>영업 목표 현황 — 시안 C (리더보드)</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>
  .podium { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; align-items:end; margin-bottom:20px; }
  .podium .p2 { order:1; } .podium .p1 { order:2; } .podium .p3 { order:3; }
  .podium-card { text-align:center; background:var(--surface); border-radius:16px; box-shadow:var(--shadow-card); padding:16px 10px; }
  .podium .p1 .podium-card { padding-top:22px; border:2px solid #fbbf24; }
  .podium-avatar { width:44px; height:44px; border-radius:999px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:14px; }
  .podium-name { font-size:12.5px; font-weight:700; }
  .podium-amt { font-size:11.5px; color:var(--slate-500); margin-top:2px; }
  .badge-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; justify-content:center; }
  .badge-pill { font-size:10px; padding:2px 8px; border-radius:999px; background:var(--surface-3); color:var(--slate-600); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">영업 목표 현황 폴더</a></div>
    <h1>영업 목표 현황 — 시안 C</h1>
    <p>게임화(리더보드) 레이아웃. 순위·배지를 강조해 팀 내 선의의 경쟁을 유도하고 싶을 때. 사기 진작용 벽면 디스플레이에 어울립니다.</p>
  </header>

  <div class="page-frame">
    <div class="page-title-row"><h2>이번 분기 리더보드</h2><span class="chip chip-muted">D-12</span></div>

    <div class="podium">
      <div class="p2"><div class="podium-card"><div class="podium-avatar" style="background:#94a3b8">🥈</div><div class="podium-name">박영업</div><div class="podium-amt">5,240만원</div></div></div>
      <div class="p1"><div class="podium-card"><div class="podium-avatar" style="background:#f59e0b">🥇</div><div class="podium-name">정영업</div><div class="podium-amt">6,800만원</div><div class="badge-row"><span class="badge-pill">3개월 연속 1위</span></div></div></div>
      <div class="p3"><div class="podium-card"><div class="podium-avatar" style="background:#b45309">🥉</div><div class="podium-name">한영업</div><div class="podium-amt">3,900만원</div></div></div>
    </div>

    <div class="glass-panel">
      <div class="u-label">전체 순위</div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>순위</th><th>이름</th><th>달성 배지</th><th>매출</th></tr></thead>
          <tbody>
            <tr><td class="rank-medal">🥇</td><td>정영업</td><td><span class="chip chip-success">목표 초과</span></td><td>6,800만원</td></tr>
            <tr><td class="rank-medal">🥈</td><td>박영업</td><td><span class="chip chip-success">목표 달성</span></td><td>5,240만원</td></tr>
            <tr><td class="rank-medal">🥉</td><td>한영업</td><td><span class="chip chip-warn">추격중</span></td><td>3,900만원</td></tr>
            <tr><td>4</td><td>오영업</td><td><span class="chip chip-error">분발 필요</span></td><td>2,100만원</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
