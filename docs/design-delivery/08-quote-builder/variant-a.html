<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>견적서 작성 — 시안 A (반복 입력행)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">견적서 작성 폴더</a></div>
    <h1>견적서 작성 — 시안 A</h1>
    <p>품목을 표처럼 반복 입력하는 정통 견적서 폼. 품목이 많을 때(10줄+) 가장 빠르게 입력할 수 있습니다. + 버튼으로 행을 추가해보세요.</p>
  </header>

  <div class="page-frame">
    <div class="page-title-row"><h2>새 견적서</h2><span class="chip chip-muted">임시저장됨</span></div>

    <div class="glass-panel">
      <div class="form-section">
        <div class="fs-title">고객 정보</div>
        <div class="form-row2">
          <div class="field"><label>고객사</label><input class="input" placeholder="숨코리아" /></div>
          <div class="field"><label>담당자</label><input class="input" placeholder="김하나" /></div>
        </div>
      </div>

      <div class="form-section">
        <div class="fs-title">품목</div>
        <div id="quote-items">
          <div class="item-row head"><span>품목명</span><span>수량</span><span>단가</span><span>합계</span><span></span></div>
          <div class="item-row">
            <input class="input" placeholder="ICONIA 스마트 인형" />
            <input class="input qty-input" type="number" value="10" oninput="recalcItemTotal('quote-items')" />
            <input class="input price-input" type="number" value="89000" oninput="recalcItemTotal('quote-items')" />
            <span class="line-total">890,000원</span>
            <button class="remove-btn" onclick="removeItemRow(this,'quote-items')">✕</button>
          </div>
          <div class="item-row">
            <input class="input" placeholder="충전 크래들" />
            <input class="input qty-input" type="number" value="10" oninput="recalcItemTotal('quote-items')" />
            <input class="input price-input" type="number" value="12000" oninput="recalcItemTotal('quote-items')" />
            <span class="line-total">120,000원</span>
            <button class="remove-btn" onclick="removeItemRow(this,'quote-items')">✕</button>
          </div>
        </div>
        <button class="btn-outline btn-sm" onclick="addItemRow('quote-items')" style="margin-top:6px">+ 품목 추가</button>
      </div>

      <div class="row" style="justify-content:flex-end;padding-top:10px;border-top:1px solid var(--hairline)">
        <span style="font-size:13px;color:var(--slate-600)">합계</span>
        <span id="quote-items-sum" style="font-size:16px;font-weight:800">1,010,000원</span>
      </div>
    </div>
    <div class="sticky-footer"><button class="btn-outline btn-sm">취소</button><button class="btn-primary btn-sm" onclick="showSnack('success','견적서가 발송되었습니다.')">발송</button></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
