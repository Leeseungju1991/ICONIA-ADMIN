<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리포트 예약/내보내기 — 시안 C (3단계 위저드)</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>.wizard-shell{max-width:520px;margin:0 auto}.wizard-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card);padding:24px}</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">리포트 예약/내보내기 폴더</a></div>
    <h1>리포트 예약/내보내기 — 시안 C</h1>
    <p>데이터 선택 → 형식 선택 → 예약 설정 3단계 위저드. 처음 리포트를 만드는 사람이 순서대로 따라가도록 유도합니다.</p>
  </header>

  <div class="page-frame">
    <div class="wizard-shell">
      <div class="progress-track" style="margin-bottom:16px"><div class="progress-fill" id="wiz-progress" style="width:33%"></div></div>
      <div class="stepper" id="wiz-stepper" style="margin-bottom:20px">
        <div class="step" data-done="false" data-active="true"><span class="circle">1</span><span class="label">데이터 선택</span></div>
        <div class="step-line"></div>
        <div class="step" data-done="false" data-active="false"><span class="circle">2</span><span class="label">형식 선택</span></div>
        <div class="step-line"></div>
        <div class="step" data-done="false" data-active="false"><span class="circle">3</span><span class="label">예약 설정</span></div>
      </div>
      <div class="wizard-card">
        <div class="wiz-panel" data-step="0">
          <div class="fs-title" style="margin-bottom:10px">어떤 데이터를 담을까요?</div>
          <label class="check-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" checked /> 매출 요약</label>
          <label class="check-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" /> 캠페인 성과</label>
          <label class="check-row" style="display:flex;align-items:center;gap:8px"><input type="checkbox" /> 영업 파이프라인</label>
        </div>
        <div class="wiz-panel" data-step="1" hidden>
          <div class="fs-title" style="margin-bottom:10px">어떤 형식으로 받을까요?</div>
          <div class="field"><label>파일 형식</label><select class="select"><option>PDF</option><option>CSV</option><option>이메일 본문</option></select></div>
        </div>
        <div class="wiz-panel" data-step="2" hidden>
          <div class="fs-title" style="margin-bottom:10px">언제, 누구에게 보낼까요?</div>
          <div class="field"><label>반복 주기</label><select class="select"><option>매주 월요일</option><option>매월 1일</option><option>매일</option></select></div>
          <div class="field"><label>수신 이메일</label><input class="input" placeholder="team-lead@iconia.com" /></div>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:20px">
          <button class="btn-outline btn-sm" id="wiz-prev" onclick="wizPrev()" disabled>이전</button>
          <button class="btn-primary btn-sm" id="wiz-next" onclick="wizNext()">다음</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const WIZ_TOTAL = 3;
  let wizStep = 0;
  function wizRender() {
    setStepper('wiz-stepper', wizStep);
    document.querySelectorAll('.wiz-panel').forEach((p) => { p.hidden = Number(p.dataset.step) !== wizStep; });
    document.getElementById('wiz-prev').disabled = wizStep === 0;
    document.getElementById('wiz-next').textContent = wizStep === WIZ_TOTAL - 1 ? '예약 완료' : '다음';
    document.getElementById('wiz-progress').style.width = Math.round(((wizStep + 1) / WIZ_TOTAL) * 100) + '%';
  }
  function wizNext() { if (wizStep < WIZ_TOTAL - 1) { wizStep++; wizRender(); } else { showSnack('success', '리포트가 예약되었습니다.'); } }
  function wizPrev() { if (wizStep > 0) { wizStep--; wizRender(); } }
</script>
</body>
</html>
