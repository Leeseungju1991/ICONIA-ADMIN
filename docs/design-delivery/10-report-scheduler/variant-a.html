<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리포트 예약/내보내기 — 시안 A (필터+미리보기)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">리포트 예약/내보내기 폴더</a></div>
    <h1>리포트 예약/내보내기 — 시안 A</h1>
    <p>필터를 설정하면 우측에 미리보기가 뜨고, 반복 주기를 정해 예약하는 구성. 리포트를 처음 설정할 때 가장 직관적입니다.</p>
  </header>

  <div class="page-frame">
    <div class="two-col">
      <div class="glass-panel">
        <div class="form-section">
          <div class="fs-title">데이터 범위</div>
          <div class="field"><label>리포트 종류</label><select class="select"><option>매출 요약</option><option>캠페인 성과</option><option>영업 파이프라인</option></select></div>
          <div class="field"><label>기간</label><select class="select"><option>이번 주</option><option>이번 달</option><option>이번 분기</option></select></div>
        </div>
        <div class="form-section">
          <div class="fs-title">반복 예약</div>
          <div class="row" style="margin-bottom:10px"><button class="switch" data-on="true" role="switch" aria-checked="true" onclick="toggleSwitch(this)"><span class="knob"></span></button><span style="font-size:13px">매주 반복</span></div>
          <div class="field"><label>수신 이메일</label><input class="input" value="team-lead@iconia.com" /></div>
        </div>
        <button class="btn-primary btn-sm" onclick="showSnack('success','리포트가 예약되었습니다.')">예약하기</button>
      </div>
      <div class="glass-panel">
        <div class="u-label">미리보기</div>
        <div class="grid" style="margin-bottom:12px">
          <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">매출</div><div class="value">8억 2천만원</div></div>
          <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#EC4899,transparent)"></div><div class="label">신규 가입</div><div class="value">3,240명</div></div>
        </div>
        <div style="font-size:11.5px;color:var(--slate-400)">매주 월요일 오전 9시에 위 형식으로 발송됩니다.</div>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
