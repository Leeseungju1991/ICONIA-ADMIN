<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실시간 테마 · 화면 구성 생성기</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  .tg-shell { max-width:1360px; }
  .tg-layout { display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start; }
  @media (max-width:900px) { .tg-layout { grid-template-columns:1fr; } }

  .tg-section { margin-bottom:20px; } .tg-section:last-child { margin-bottom:0; }
  .tg-section-title { font-size:11px; font-weight:700; color:var(--slate-600); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px; }

  .tg-swatch-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tg-swatch { width:28px; height:28px; border-radius:999px; border:2px solid transparent; cursor:pointer; padding:0; box-shadow:var(--shadow-card); }
  .tg-swatch[aria-current="true"] { border-color:var(--slate-900); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--slate-900); }
  .tg-hex-input { width:28px; height:28px; padding:0; border:none; border-radius:8px; cursor:pointer; background:none; }

  .tg-select { width:100%; margin-bottom:4px; }

  .tg-check-list { display:flex; flex-direction:column; gap:2px; }
  .tg-check-row { display:flex; align-items:baseline; gap:8px; padding:8px 6px; border-radius:8px; cursor:pointer; font-size:12.5px; }
  .tg-check-row:hover { background:var(--surface-3); }
  .tg-check-row input { flex-shrink:0; margin-top:2px; }
  .tg-check-row b { font-weight:700; white-space:nowrap; }
  .tg-check-desc { color:var(--slate-400); font-size:11px; }

  .tg-radio-row { display:flex; gap:14px; }
  .tg-radio-row label { display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }

  .tg-preview-toolbar { margin-bottom:10px; }
  .tg-preview-toolbar .summary { font-size:12px; color:var(--slate-600); }
  .tg-preview { min-height:320px; }
  .tg-dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; align-items:start; }

  .tg-story-block { border:1px solid var(--hairline); border-radius:16px; padding:16px; margin-bottom:16px; background:var(--surface-2); }
  .tg-story-block:last-child { margin-bottom:0; }
  .tg-story-label { display:flex; align-items:baseline; gap:8px; margin-bottom:12px; }
  .tg-story-label b { font-size:13px; }
  .tg-story-label span { font-size:11.5px; color:var(--slate-500); }

  .tg-token-box { margin-top:14px; background:var(--slate-900); color:#e2e8f0; border-radius:12px; padding:14px 16px; font-size:12px; line-height:1.7; white-space:pre-wrap; overflow-x:auto; }
</style>
</head>
<body>
<div id="snackbar-stack"></div>
<div class="app-shell tg-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../index.html">← 전체 목록</a></div>
    <h1>실시간 테마 · 화면 구성 생성기</h1>
    <p>색상 팔레트, 대주제, 화면 구성요소를 왼쪽에서 고르면 오른쪽 미리보기가 바로 바뀝니다. 확정한 색상은 아래 토큰 코드로 복사해 전달할 수 있습니다.</p>
  </header>

  <div class="page-frame">
    <div class="tg-layout">
      <aside class="tg-controller glass-panel">
        <div class="tg-section">
          <div class="tg-section-title">① 색상 팔레트</div>
          <div class="tg-swatch-row" id="tg-swatch-row">
            <button type="button" class="tg-swatch" id="swatch-violet" style="background:#6D5DFE" aria-current="true" onclick="tgSetPalette('violet')" title="보라(기본)"></button>
            <button type="button" class="tg-swatch" id="swatch-blue" style="background:#2563EB" aria-current="false" onclick="tgSetPalette('blue')" title="블루"></button>
            <button type="button" class="tg-swatch" id="swatch-teal" style="background:#0D9488" aria-current="false" onclick="tgSetPalette('teal')" title="틸"></button>
            <button type="button" class="tg-swatch" id="swatch-green" style="background:#059669" aria-current="false" onclick="tgSetPalette('green')" title="그린"></button>
            <button type="button" class="tg-swatch" id="swatch-orange" style="background:#EA580C" aria-current="false" onclick="tgSetPalette('orange')" title="오렌지"></button>
            <button type="button" class="tg-swatch" id="swatch-pink" style="background:#DB2777" aria-current="false" onclick="tgSetPalette('pink')" title="핑크"></button>
            <input type="color" class="tg-hex-input" id="tg-hex" value="#6D5DFE" oninput="tgApplyCustomHex(this.value)" title="직접 색상 선택" />
          </div>
        </div>

        <div class="tg-section">
          <div class="tg-section-title">② 대주제 화면</div>
          <select class="select tg-select" id="tg-topic" onchange="onTopicChange(this)"></select>
        </div>

        <div class="tg-section">
          <div class="tg-section-title">③ 소주제 화면 (구성 프리셋)</div>
          <select class="select tg-select" id="tg-page" onchange="onPageChange(this)"></select>
        </div>

        <div class="tg-section">
          <div class="tg-section-title">④ UI/UX 구성요소 배치</div>
          <div class="tg-check-list" id="tg-comp-list"></div>
        </div>

        <div class="tg-section">
          <div class="tg-section-title">⑤ 레이아웃 모드</div>
          <div class="tg-radio-row">
            <label><input type="radio" name="tg-layout" value="dash" checked onchange="onLayoutChange('dash')"> 대시보드 뷰</label>
            <label><input type="radio" name="tg-layout" value="story" onchange="onLayoutChange('story')"> 스토리북 뷰</label>
          </div>
        </div>
      </aside>

      <section class="tg-preview-col">
        <div class="tg-preview-toolbar row">
          <div class="grow summary" id="tg-summary"></div>
          <button type="button" class="btn-outline btn-sm" onclick="copyToClipboard('#tg-token-output')">🎨 토큰 복사</button>
        </div>
        <div class="tg-preview glass-panel" id="tg-preview"></div>
        <pre class="tg-token-box" id="tg-token-output"></pre>
      </section>
    </div>
  </div>
</div>

<script src="interactions.js"></script>
<script>
const TOPICS = [
  { id:'01', name:'01. 사내 통합 지식 검색 포털' },
  { id:'02', name:'02. SOP·매뉴얼 공유 포털' },
  { id:'03', name:'03. RPA 자동화 대시보드' },
  { id:'04', name:'04. CS 티켓팅 시스템' },
  { id:'05', name:'05. 브랜드 에셋 라이브러리' },
  { id:'06', name:'06. 데이터 허브 포털' },
  { id:'07', name:'07. 시스템 모니터링 대시보드' },
  { id:'08', name:'08. IT·보안 컴플라이언스 포털' },
  { id:'09', name:'09. B2B PoC 샌드박스 포털' },
  { id:'10', name:'10. 임직원 서비스 포털' },
];

const MINOR_PAGES = [
  { id:'home',     label:'대시보드 홈',       comps:['kpi','table','tabs'] },
  { id:'list',     label:'목록 · 검색 결과',  comps:['table','banner'] },
  { id:'detail',   label:'상세 페이지',       comps:['checklist','banner'] },
  { id:'form',     label:'생성 · 입력 폼',    comps:['form','banner'] },
  { id:'collab',   label:'협업 · 대화형',     comps:['chat','checklist'] },
  { id:'pipeline', label:'칸반 · 파이프라인', comps:['kanban','kpi'] },
];

function buildKpi() {
  return '<div class="grid">'
    + ['이번 주 처리 건수|128|▲ 12% 지난주 대비|up',
       '평균 처리 시간|2.4시간|▼ 8% 단축|up',
       '대기 중 건수|6|▲ 2건 증가|down',
       '만족도 점수|94점|변동 없음|flat']
      .map((row) => {
        const [label, value, delta, tone] = row.split('|');
        return '<div class="stat-card"><span class="blob" style="background:var(--accent)"></span>'
          + '<div class="label">' + label + '</div>'
          + '<div class="value">' + value + '</div>'
          + '<div class="delta ' + tone + '">' + delta + '</div></div>';
      }).join('')
    + '</div>';
}

function buildTable() {
  return '<div class="panel-head"><h3>최근 처리 목록</h3><p>구성요소 미리보기용 예시 데이터입니다.</p></div>'
    + '<div class="table-scroll"><table class="data-table"><thead><tr><th>이름</th><th>상태</th><th>담당자</th><th>업데이트</th></tr></thead><tbody>'
    + '<tr><td>온보딩 체크리스트 v3</td><td><span class="chip chip-success">완료</span></td><td>김도윤</td><td>3분 전</td></tr>'
    + '<tr><td>분기 보안 점검</td><td><span class="chip chip-warn">진행중</span></td><td>이서연</td><td>1시간 전</td></tr>'
    + '<tr><td>신규 파트너 온보딩</td><td><span class="chip chip-info">대기</span></td><td>박지훈</td><td>어제</td></tr>'
    + '</tbody></table></div>';
}

function buildKanban() {
  const cols = [
    ['대기', ['신규 문의 #128 · 방금 접수', '신규 문의 #129 · 5분 전']],
    ['진행중', ['배송 지연 문의 · 10분 전']],
    ['완료', ['환불 요청 처리 · 어제']],
  ];
  return '<div class="panel-head"><h3>진행 파이프라인</h3></div><div class="kanban-board">'
    + cols.map(([label, cards]) => {
      return '<div class="kanban-col"><div class="kanban-col-head">' + label + ' <span class="count">' + cards.length + '</span></div><div class="kanban-col-body">'
        + cards.map((c) => {
          const [name, meta] = c.split(' · ');
          return '<div class="kanban-card"><div class="name">' + name + '</div><div class="meta">' + meta + '</div></div>';
        }).join('')
        + '</div></div>';
    }).join('')
    + '</div>';
}

function buildChat() {
  return '<div class="panel-head"><h3>상담 스레드</h3></div><div class="msg-thread">'
    + '<div class="msg-bubble customer">배송이 아직 안 왔어요.<span class="meta">고객 · 10:02</span></div>'
    + '<div class="msg-bubble agent">확인 후 바로 안내드릴게요!<span class="meta">상담원 · 10:03</span></div>'
    + '<div class="msg-bubble internal">운송장 확인 필요 — 물류팀 문의중<span class="meta">내부 메모</span></div>'
    + '</div>';
}

function buildChecklist() {
  return '<div class="panel-head"><h3>점검 체크리스트</h3></div>'
    + '<div class="checklist-item"><span class="status-icon pass">✓</span><span class="label">접근 권한 최소화 원칙 적용</span><span class="owner">보안팀</span></div>'
    + '<div class="checklist-item"><span class="status-icon pending">…</span><span class="label">분기별 취약점 점검</span><span class="owner">인프라팀</span></div>'
    + '<div class="checklist-item"><span class="status-icon fail">✕</span><span class="label">퇴사자 계정 즉시 회수</span><span class="owner">인사팀</span></div>';
}

function buildForm() {
  return '<div class="panel-head"><h3>신규 요청 작성</h3></div><div class="form-section">'
    + '<div class="field"><label>제목<span class="req">*</span></label><input class="input" placeholder="요청 제목을 입력하세요"></div>'
    + '<div class="form-row2"><div class="field"><label>담당 부서</label><select class="select"><option>인사팀</option><option>총무팀</option></select></div>'
    + '<div class="field"><label>희망 처리일</label><input class="input" type="date"></div></div>'
    + '<div class="field"><label>상세 내용</label><textarea class="input" rows="3" placeholder="내용을 입력하세요"></textarea></div>'
    + '</div><div class="row" style="justify-content:flex-end"><button type="button" class="btn-outline btn-sm">임시저장</button><button type="button" class="btn-primary btn-sm">제출하기</button></div>';
}

function buildTabs() {
  return '<div class="tabs"><button type="button" class="tab" aria-selected="true">개요</button><button type="button" class="tab" aria-selected="false">이력</button><button type="button" class="tab" aria-selected="false">첨부파일</button></div>'
    + '<div style="padding:14px 4px;font-size:12.5px;color:var(--slate-600)">선택한 탭의 내용이 이 영역에 표시됩니다.</div>';
}

function buildBanner() {
  return '<div class="banner info"><span class="icon">ℹ️</span><div><p class="title">안내</p><p class="desc">이 영역은 사용자에게 중요한 공지를 보여줄 때 사용합니다.</p></div></div>';
}

const COMPONENTS = {
  kpi:       { label:'KPI 통계 카드', desc:'핵심 지표를 카드로 한눈에 보여줍니다.', build:buildKpi, full:true },
  table:     { label:'데이터 테이블', desc:'목록형 데이터를 표로 정리해 보여줍니다.', build:buildTable },
  kanban:    { label:'칸반 보드', desc:'단계별 진행 상태를 컬럼으로 나눠 보여줍니다.', build:buildKanban, full:true },
  chat:      { label:'대화형 스레드', desc:'상담·협업 메시지를 말풍선으로 표현합니다.', build:buildChat },
  checklist: { label:'체크리스트', desc:'점검 항목과 완료 여부를 목록으로 보여줍니다.', build:buildChecklist },
  form:      { label:'입력 폼', desc:'새 항목을 등록하는 입력 폼입니다.', build:buildForm },
  tabs:      { label:'탭 메뉴', desc:'화면 안에서 콘텐츠를 구역별로 전환합니다.', build:buildTabs },
  banner:    { label:'안내 배너', desc:'중요 공지나 상태 메시지를 강조해 보여줍니다.', build:buildBanner },
};
const COMP_ORDER = ['kpi', 'table', 'kanban', 'chat', 'form', 'checklist', 'tabs', 'banner'];

const state = { topic:'01', page:'home', comps:new Set(MINOR_PAGES[0].comps), layout:'dash' };

function tgHexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.substr(0, 2), 16), parseInt(m.substr(2, 2), 16), parseInt(m.substr(4, 2), 16)];
}
function tgShade(hex, percent) {
  const [r, g, b] = tgHexToRgb(hex);
  const f = (c) => Math.max(0, Math.min(255, Math.round(c + (percent / 100) * 255)));
  return '#' + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, '0')).join('');
}

function tgSetPalette(name) {
  setPalette(name);
  document.querySelectorAll('.tg-swatch').forEach((b) => {
    b.setAttribute('aria-current', String(b.id === 'swatch-' + name));
  });
  updateTokenOutput();
}

function tgApplyCustomHex(hex) {
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-hover', tgShade(hex, -12));
  document.querySelectorAll('.tg-swatch').forEach((b) => b.setAttribute('aria-current', 'false'));
  try {
    localStorage.setItem('sg-palette', 'custom');
    localStorage.setItem('tg-custom-hex', hex);
  } catch (e) { /* 저장 불가 시에도 현재 화면 색상은 그대로 적용됨 */ }
  updateTokenOutput();
}

function onCompToggle(key, checked) {
  if (checked) state.comps.add(key); else state.comps.delete(key);
  render();
}

function onTopicChange(sel) {
  state.topic = sel.value;
  render();
}

function onPageChange(sel) {
  state.page = sel.value;
  const preset = MINOR_PAGES.find((p) => p.id === state.page);
  state.comps = new Set(preset.comps);
  document.querySelectorAll('#tg-comp-list input[type=checkbox]').forEach((cb) => {
    cb.checked = state.comps.has(cb.id.replace('comp-', ''));
  });
  render();
}

function onLayoutChange(val) {
  state.layout = val;
  render();
}

function render() {
  const wrap = document.getElementById('tg-preview');
  const selected = COMP_ORDER.filter((k) => state.comps.has(k));
  if (selected.length === 0) {
    wrap.innerHTML = '<div class="state-box">왼쪽에서 구성요소를 하나 이상 선택하세요.</div>';
    updateTokenOutput();
    return;
  }
  let html;
  if (state.layout === 'story') {
    html = selected.map((k) => {
      const c = COMPONENTS[k];
      return '<div class="tg-story-block"><div class="tg-story-label"><b>' + c.label + '</b><span>' + c.desc + '</span></div>' + c.build() + '</div>';
    }).join('');
  } else {
    html = '<div class="tg-dash-grid">' + selected.map((k) => {
      const c = COMPONENTS[k];
      const span = c.full ? ' style="grid-column:1/-1"' : '';
      return '<div class="glass-panel"' + span + '>' + c.build() + '</div>';
    }).join('') + '</div>';
  }
  wrap.innerHTML = html;
  updateTokenOutput();
}

function updateTokenOutput() {
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--accent').trim();
  const hover = styles.getPropertyValue('--accent-hover').trim();
  const topic = TOPICS.find((t) => t.id === state.topic);
  const page = MINOR_PAGES.find((p) => p.id === state.page);
  const compsLabel = COMP_ORDER.filter((k) => state.comps.has(k)).map((k) => COMPONENTS[k].label).join(', ') || '없음';
  const layoutLabel = state.layout === 'story' ? '스토리북 뷰' : '대시보드 뷰';
  document.getElementById('tg-token-output').textContent =
    ':root {\n  --accent: ' + accent + ';\n  --accent-hover: ' + hover + ';\n}\n\n'
    + '/* 선택 화면: ' + topic.name + ' > ' + page.label + ' (' + layoutLabel + ') */\n'
    + '/* 구성요소: ' + compsLabel + ' */';
  document.getElementById('tg-summary').textContent =
    topic.name + ' · ' + page.label + ' · ' + layoutLabel + ' · 구성요소 ' + state.comps.size + '개';
}

function tgInit() {
  document.getElementById('tg-topic').innerHTML = TOPICS.map((t) => '<option value="' + t.id + '">' + t.name + '</option>').join('');
  document.getElementById('tg-page').innerHTML = MINOR_PAGES.map((p) => '<option value="' + p.id + '">' + p.label + '</option>').join('');
  document.getElementById('tg-comp-list').innerHTML = COMP_ORDER.map((k) => {
    const c = COMPONENTS[k];
    return '<label class="tg-check-row"><input type="checkbox" id="comp-' + k + '" onchange="onCompToggle(\'' + k + '\', this.checked)"><span><b>' + c.label + '</b> <span class="tg-check-desc">' + c.desc + '</span></span></label>';
  }).join('');

  document.getElementById('tg-topic').value = state.topic;
  document.getElementById('tg-page').value = state.page;
  document.querySelectorAll('#tg-comp-list input[type=checkbox]').forEach((cb) => {
    cb.checked = state.comps.has(cb.id.replace('comp-', ''));
  });

  try {
    const savedPalette = localStorage.getItem('sg-palette');
    if (savedPalette === 'custom') {
      const hex = localStorage.getItem('tg-custom-hex');
      if (hex) {
        document.getElementById('tg-hex').value = hex;
        tgApplyCustomHex(hex);
      }
    } else if (savedPalette) {
      const btn = document.getElementById('swatch-' + savedPalette);
      if (btn) document.querySelectorAll('.tg-swatch').forEach((b) => b.setAttribute('aria-current', String(b.id === 'swatch-' + savedPalette)));
    }
  } catch (e) { /* storage 접근 불가 시 기본(보라) 유지 */ }

  render();
}
document.addEventListener('DOMContentLoaded', tgInit);
</script>
</body>
</html>
