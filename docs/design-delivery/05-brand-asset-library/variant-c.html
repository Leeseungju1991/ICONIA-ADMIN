<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>브랜드 에셋 라이브러리 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>.coll-card{cursor:pointer}.coll-card .thumb{height:64px;border-radius:10px 10px 0 0}.fav-btn{position:relative;float:right;background:none;border:none;cursor:pointer;font-size:14px}</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">브랜드 에셋 라이브러리 폴더</a></div>
    <h1>마케팅 콘텐츠·브랜드 에셋 라이브러리 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 컬렉션(캠페인별) 큐레이션형</h4>
      <ul><li>파일 수가 아주 많을 때 개별 탐색 대신 담당자가 미리 묶어둔 컬렉션으로 진입 — 외부 협력사 공유용으로도 적합</li><li>★ 버튼으로 자주 쓰는 컬렉션을 상단에 고정</li></ul>
    </div>

    <div class="u-label">⭐ 즐겨찾기</div>
    <div class="grid" style="margin-bottom:16px" id="fav-grid"></div>

    <div class="u-label">전체 컬렉션</div>
    <div class="grid" id="all-grid"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '05c';
  const COLLS = [
    { id:'col1', title:'2026 가을 캠페인', count:24, color:'linear-gradient(135deg,var(--accent),#8b7cff)' },
    { id:'col2', title:'브랜드 기본 키트', count:12, color:'linear-gradient(135deg,#EC4899,#f472b6)' },
    { id:'col3', title:'제품 카탈로그 사진', count:48, color:'linear-gradient(135deg,#60A5FA,#93c5fd)' },
    { id:'col4', title:'SNS 템플릿', count:18, color:'linear-gradient(135deg,#14B8A6,#5eead4)' },
    { id:'col5', title:'외부 협력사 배포용', count:9, color:'linear-gradient(135deg,#f59e0b,#fbbf24)' },
  ];
  function card(c) {
    const fav = sgIsFavorite(NS, c.id);
    return '<div class="glass-card coll-card"><button class="fav-btn" onclick="event.stopPropagation();toggleFav(\'' + c.id + '\')">' + (fav ? '★' : '☆') + '</button>' +
      '<div onclick="location.href=\'./variant-c-detail.html?id=' + c.id + '\'"><div class="thumb" style="background:' + c.color + '"></div><div style="padding-top:8px"><b style="font-size:12.5px">' + c.title + '</b><div style="font-size:11px;color:var(--slate-400)">에셋 ' + c.count + '개</div></div></div></div>';
  }
  function render() {
    const favs = COLLS.filter((c) => sgIsFavorite(NS, c.id));
    document.getElementById('fav-grid').innerHTML = favs.length ? favs.map(card).join('') : '<div class="state-box">즐겨찾기한 컬렉션이 없습니다. ☆를 눌러 추가해보세요.</div>';
    document.getElementById('all-grid').innerHTML = COLLS.map(card).join('');
  }
  function toggleFav(id) {
    const dummy = document.createElement('button');
    toggleFavorite(NS, id, dummy);
    render();
  }
  render();
</script>
</body>
</html>
