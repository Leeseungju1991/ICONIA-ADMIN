<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B2B PoC 샌드박스 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">B2B PoC 샌드박스 포털 폴더</a></div>
    <h1>B2B 서비스 구독·PoC 샌드박스 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 서비스 카탈로그 선택 카드형(도입 검토용)</h4>
      <ul><li>가격·플랜 비교가 핵심인 도입 검토 단계 — 선택 카드 그리드가 가장 익숙한 SaaS 랜딩 패턴</li><li>카드를 누르면 서비스 상세에서 PoC를 바로 신청</li></ul>
    </div>

    <div class="page-title-row"><h2>서비스 카탈로그</h2></div>
    <div class="grid" id="svc-grid"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '09a';
  const SERVICES = [
    { id:'sv1', name:'AI Key 관리 API', price:'월 30만원', poc:'30일 무료 PoC' },
    { id:'sv2', name:'디바이스 원격 모니터링', price:'월 50만원', poc:'14일 무료 PoC' },
    { id:'sv3', name:'CS 자동응대 봇', price:'월 20만원', poc:'30일 무료 PoC' },
  ];
  document.getElementById('svc-grid').innerHTML = SERVICES.map((s) => {
    const applied = sgGetJSON(NS + '-applied-' + s.id, false);
    return '<a href="./variant-a-detail.html?id=' + s.id + '" class="text-plain"><div class="glass-card">' +
      '<b style="font-size:13px">' + s.name + '</b>' + (applied ? ' <span class="chip chip-success">신청됨</span>' : '') +
      '<div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">' + s.price + ' · ' + s.poc + '</div></div></a>';
  }).join('');
</script>
</body>
</html>
