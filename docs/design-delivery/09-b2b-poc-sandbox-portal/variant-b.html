<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B2B PoC 샌드박스 포털 — 시안 B</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">B2B PoC 샌드박스 포털 폴더</a></div>
    <h1>B2B 서비스 구독·PoC 샌드박스 포털 — 시안 B</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 내 샌드박스 운영 대시보드형</h4>
      <ul><li>이미 도입을 진행 중인 파트너사가 "내 샌드박스가 잘 돌아가는지" 확인하는 운영 대시보드형</li><li>환경을 누르면 사용량 상세를 보고 "연장 요청"을 바로 접수</li></ul>
    </div>

    <div class="grid" style="margin-bottom:16px">
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">API 호출량(이번달)</div><div class="value">128,400</div><div class="delta"><span class="flat">쿼터 500,000 중</span></div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#f59e0b,transparent)"></div><div class="label">PoC 만료까지</div><div class="value">D-6</div></div>
    </div>
    <div class="progress-track" style="height:10px;margin-bottom:16px"><div class="progress-fill" style="width:26%"></div></div>

    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>환경</th><th>서비스</th><th>상태</th><th>만료일</th></tr></thead>
      <tbody id="env-tbody"></tbody>
    </table></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '09b';
  const ENVS = [
    { id:'env1', name:'sandbox-01', service:'AI Key 관리 API', status:'정상', expiry:'2026-10-03' },
    { id:'env2', name:'sandbox-02', service:'디바이스 원격 모니터링', status:'만료 임박', expiry:'2026-09-30' },
  ];
  function statusChip(s) { return s === '정상' ? 'chip-success' : s === '연장됨' ? 'chip-success' : 'chip-warn'; }
  document.getElementById('env-tbody').innerHTML = ENVS.map((e) => {
    const extended = sgGetJSON(NS + '-extended-' + e.id, false);
    const status = extended ? '연장됨' : e.status;
    const expiry = extended ? '2026-10-31' : e.expiry;
    return '<tr style="cursor:pointer" onclick="location.href=\'./variant-b-detail.html?id=' + e.id + '\'"><td>' + e.name + '</td><td>' + e.service + '</td><td><span class="chip ' + statusChip(status) + '">' + status + '</span></td><td>' + expiry + '</td></tr>';
  }).join('');
</script>
</body>
</html>
