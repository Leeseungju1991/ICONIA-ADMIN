<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>팀별 성과 대시보드 — 시안 B (팀 카드 비교)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">팀별 성과 대시보드 폴더</a></div>
    <h1>팀별 성과 대시보드 — 시안 B</h1>
    <p>모든 팀을 카드로 나란히 늘어놓고 한눈에 비교하는 구성. 팀 수가 적을 때(3~5개) 탭 클릭 없이 바로 비교됩니다.</p>
  </header>

  <div class="page-frame">
    <div class="grid">
      <div class="glass-panel">
        <div class="panel-head"><div><h3>영업 1팀</h3></div><span class="chip chip-warn">52%</span></div>
        <div class="progress-track" style="height:8px;margin-bottom:8px"><div class="progress-fill" style="width:52%"></div></div>
        <div style="font-size:12px;color:var(--slate-500)">4억 1,600만원 / 8억원</div>
      </div>
      <div class="glass-panel">
        <div class="panel-head"><div><h3>영업 2팀</h3></div><span class="chip chip-success">88%</span></div>
        <div class="progress-track" style="height:8px;margin-bottom:8px"><div class="progress-fill" style="width:88%"></div></div>
        <div style="font-size:12px;color:var(--slate-500)">6억 6,000만원 / 7억 5천만원</div>
      </div>
      <div class="glass-panel">
        <div class="panel-head"><div><h3>마케팅팀</h3></div><span class="chip chip-success">104%</span></div>
        <div class="progress-track" style="height:8px;margin-bottom:8px"><div class="progress-fill" style="width:100%"></div></div>
        <div style="font-size:12px;color:var(--slate-500)">캠페인 12건 · 리드 340건 확보</div>
      </div>
      <div class="glass-panel">
        <div class="panel-head"><div><h3>CS팀</h3></div><span class="chip chip-warn">76%</span></div>
        <div class="progress-track" style="height:8px;margin-bottom:8px"><div class="progress-fill" style="width:76%"></div></div>
        <div style="font-size:12px;color:var(--slate-500)">NPS 목표 대비 진행중</div>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
