<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>팀별 성과 대시보드 — 시안 A (팀 전환 탭)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">팀별 성과 대시보드 폴더</a></div>
    <h1>팀별 성과 대시보드 — 시안 A</h1>
    <p>탭으로 팀을 전환하며 팀별 순위·진행바를 보는 구성. 팀 수가 많아도(5개+) 화면이 늘어지지 않습니다.</p>
  </header>

  <div class="page-frame">
    <div class="tabs" role="tablist" style="margin-bottom:16px">
      <button class="tab" role="tab" aria-selected="true" onclick="switchTab(this,'team1')">영업 1팀</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'team2')">영업 2팀</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'team3')">마케팅팀</button>
    </div>

    <div class="tab-panel" data-panel="team1">
      <div class="glass-panel" style="margin-bottom:16px">
        <div class="panel-head"><div><h3>목표 진행률</h3></div><span class="chip chip-warn">52%</span></div>
        <div class="progress-track" style="height:10px"><div class="progress-fill" style="width:52%"></div></div>
      </div>
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>순위</th><th>이름</th><th>달성률</th></tr></thead>
        <tbody><tr><td class="rank-medal">🥇</td><td>정영업</td><td><span class="chip chip-success">104%</span></td></tr><tr><td class="rank-medal">🥈</td><td>박영업</td><td><span class="chip chip-success">91%</span></td></tr></tbody>
      </table></div>
    </div>
    <div class="tab-panel" data-panel="team2" hidden>
      <div class="glass-panel" style="margin-bottom:16px">
        <div class="panel-head"><div><h3>목표 진행률</h3></div><span class="chip chip-success">88%</span></div>
        <div class="progress-track" style="height:10px"><div class="progress-fill" style="width:88%"></div></div>
      </div>
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>순위</th><th>이름</th><th>달성률</th></tr></thead>
        <tbody><tr><td class="rank-medal">🥇</td><td>윤영업</td><td><span class="chip chip-success">120%</span></td></tr></tbody>
      </table></div>
    </div>
    <div class="tab-panel" data-panel="team3" hidden>
      <div class="glass-panel"><div class="panel-head"><div><h3>목표 진행률</h3></div><span class="chip chip-success">104%</span></div><div class="progress-track" style="height:10px"><div class="progress-fill" style="width:100%"></div></div></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
