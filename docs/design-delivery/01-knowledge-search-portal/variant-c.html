<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지식 검색 포털 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">지식 검색 포털 폴더</a></div>
    <h1>사내 통합 지식 검색 포털 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 동료 Q&A 커뮤니티형</h4>
      <ul><li>문서를 찾는 대신 "아는 사람에게 직접 물어보는" 사내 질문·답변 게시판. 검색으로 안 나오는 애매한 질문에 강함</li><li>질문 등록, 답변 작성, 도움됨 추천, 답변 채택까지 한 화면 안에서 처리</li></ul>
    </div>

    <div class="page-title-row"><h2 style="margin:0">사내 Q&A</h2><a href="./variant-c-new.html" class="btn-primary btn-sm">+ 질문하기</a></div>

    <div class="pill-tabs" style="margin-bottom:16px" id="sort-tabs">
      <button class="pill-tab" aria-selected="true" onclick="setSort('hot',this)">인기순</button>
      <button class="pill-tab" aria-selected="false" onclick="setSort('new',this)">최신순</button>
      <button class="pill-tab" aria-selected="false" onclick="setSort('unanswered',this)">미답변만</button>
    </div>

    <div class="glass-panel" id="q-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '01c';
  const SEED = [
    { id:'q1', title:'연차는 최대 며칠까지 이월할 수 있나요?', dept:'인사', votes:12, ts:Date.parse('2026-09-20'),
      answers:[{ author:'이하늘(인사팀)', text:'인사 규정 제12조에 따라 최대 5일까지 이월 가능하고, 초과분은 회계연도 말 소멸됩니다.', ts:Date.parse('2026-09-20T10:00:00'), accepted:true }] },
    { id:'q2', title:'재택근무 중에도 VPN을 꼭 연결해야 하나요?', dept:'IT', votes:8, ts:Date.parse('2026-09-18'),
      answers:[{ author:'정민수(IT팀)', text:'네, 사내망 리소스 접근 시 VPN 연결이 필수입니다. 공용 와이파이에서는 특히 더 필요해요.', ts:Date.parse('2026-09-18T14:00:00'), accepted:true }] },
    { id:'q3', title:'법인카드로 팀 회식비 결제해도 되나요? 한도가 궁금합니다', dept:'총무', votes:5, ts:Date.parse('2026-09-22'), answers:[] },
    { id:'q4', title:'신규 입사자 장비 신청은 언제까지 해야 하나요?', dept:'인사', votes:3, ts:Date.parse('2026-09-15'),
      answers:[{ author:'한지민(총무팀)', text:'입사 5영업일 전까지 신청하면 첫날 수령 가능합니다.', ts:Date.parse('2026-09-15T09:30:00'), accepted:false }] },
    { id:'q5', title:'회의실 예약 취소는 어디서 하나요?', dept:'총무', votes:1, ts:Date.parse('2026-09-24'), answers:[] },
  ];
  function loadQuestions() {
    let list = sgGetJSON('sg-community-' + NS, null);
    if (!list) { list = SEED; sgSetJSON('sg-community-' + NS, list); }
    return list;
  }
  let sortMode = 'hot';
  function setSort(mode, btn) {
    sortMode = mode;
    document.querySelectorAll('#sort-tabs .pill-tab').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
    render();
  }
  function render() {
    let list = loadQuestions().slice();
    if (sortMode === 'hot') list.sort((a, b) => b.votes - a.votes);
    else if (sortMode === 'new') list.sort((a, b) => b.ts - a.ts);
    else if (sortMode === 'unanswered') list = list.filter((q) => q.answers.length === 0).sort((a, b) => b.ts - a.ts);

    document.getElementById('q-list').innerHTML = list.length ? list.map((q, i) => (
      '<a href="./variant-c-detail.html?id=' + q.id + '" style="text-decoration:none;color:inherit;display:flex;gap:14px;padding:12px 0;' + (i < list.length - 1 ? 'border-bottom:1px solid var(--hairline)' : '') + '">' +
      '<div style="text-align:center;min-width:40px"><b style="font-size:14px;color:var(--accent)">' + q.votes + '</b><div style="font-size:10px;color:var(--slate-400)">도움됨</div></div>' +
      '<div style="flex:1"><b style="font-size:13px">' + q.title + '</b> <span class="chip chip-muted" style="margin-left:6px">' + q.dept + '</span>' +
      (q.answers.length ? ' <span class="chip chip-success">답변 ' + q.answers.length + '</span>' : ' <span class="chip chip-warn">미답변</span>') +
      '<div style="font-size:11px;color:var(--slate-400);margin-top:4px">' + new Date(q.ts).toLocaleDateString('ko-KR') + '</div></div>' +
      '</a>'
    )).join('') : '<div class="state-box">조건에 맞는 질문이 없습니다.</div>';
  }
  render();
</script>
</body>
</html>
