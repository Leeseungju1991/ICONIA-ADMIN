<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지식 검색 포털 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">지식 검색 포털 폴더</a></div>
    <h1>사내 통합 지식 검색 포털 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 실무자 효율형(검색엔진 패턴)</h4>
      <ul><li>홈에서 검색하면 결과 목록으로, 결과에서 문서를 고르면 상세로 이어지는 흐름</li><li>많이 써본 검색엔진과 동일한 사고 흐름 — 빠르게 찾고 바로 나가는 것이 목표, 화면 전환·장식은 최소화</li><li>문서를 즐겨찾기해두면 다음에 방문했을 때도 그대로 모아서 볼 수 있음</li></ul>
    </div>

    <div class="page-title-row"><h2>무엇을 찾고 계신가요?</h2><a href="./variant-a-favorites.html" class="btn-outline btn-sm">☆ 즐겨찾기 보기</a></div>

    <form id="home-search-form" class="page-toolbar" style="margin-bottom:20px">
      <div class="input-wrap grow"><input class="input" id="home-search-input" placeholder="예: 연차 신청 방법" oninput="onSearchInput(this)" style="padding-right:34px" /><button type="button" class="clear-btn" onclick="clearSearch(this)">✕</button></div>
      <button type="submit" class="btn-primary btn-sm">검색</button>
    </form>

    <div class="u-label">자주 찾는 검색어</div>
    <div class="row" style="margin-bottom:24px">
      <button type="button" class="pill-tab" onclick="runQuickSearch('연차')">연차</button>
      <button type="button" class="pill-tab" onclick="runQuickSearch('VPN')">VPN</button>
      <button type="button" class="pill-tab" onclick="runQuickSearch('법인카드')">법인카드</button>
      <button type="button" class="pill-tab" onclick="runQuickSearch('온보딩')">온보딩</button>
      <button type="button" class="pill-tab" onclick="runQuickSearch('회의실')">회의실</button>
    </div>

    <div class="u-label">🔥 이번 주 많이 본 문서</div>
    <div class="glass-panel" id="popular-list"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const DOCS = [
    { id:'d1', title:'연차 신청 방법 안내', type:'위키', dept:'인사', date:'2026-08-11', views:1204, body:'사내 인사 시스템(HRIS) &gt; 근태 &gt; 연차신청 메뉴에서 신청합니다. 신청 후 팀장 승인이 완료되면 캘린더에 자동 반영됩니다. 반차/반반차도 동일한 메뉴에서 신청할 수 있습니다.' },
    { id:'d2', title:'연차 관련 인사 규정 제12조', type:'규정', dept:'인사', date:'2026-05-02', views:862, body:'제12조(연차의 이월) 미사용 연차는 최대 5일까지 다음 회계연도로 이월할 수 있습니다. 5일을 초과하는 연차는 회계연도 말 자동 소멸되며, 별도 보상하지 않습니다.' },
    { id:'d3', title:'2026년 하반기 연차 사용 독려 공지', type:'공지', dept:'총무', date:'2026-09-01', views:430, body:'하반기 미사용 연차 소진을 위해 팀별 연차 사용 계획을 10월 말까지 제출해 주세요. 12월에는 연차 소진 주간을 운영합니다.' },
    { id:'d4', title:'신규 입사자 온보딩 가이드', type:'매뉴얼', dept:'인사', date:'2026-07-20', views:980, body:'입사 첫 주 체크리스트: 사내 계정 발급, 장비 수령, 필수 교육 이수, 팀 소개 미팅. 온보딩 담당자가 첫날 안내 메일을 발송합니다.' },
    { id:'d5', title:'사내 와이파이 접속 및 VPN 설정 안내', type:'매뉴얼', dept:'IT', date:'2026-06-15', views:862, body:'회사 와이파이 SSID는 ICONIA-Secure이며, 사내 계정으로 인증합니다. 외부에서 사내망 접속 시 VPN 클라이언트를 통해서만 접속할 수 있습니다.' },
    { id:'d6', title:'보안 정책 v2.1 (재택근무 보안수칙 포함)', type:'규정', dept:'보안', date:'2026-08-30', views:551, body:'재택근무 시 VPN 필수 연결, 공용 와이파이 사용 금지, 화면 잠금 자동 설정(5분) 등을 준수해야 합니다.' },
    { id:'d7', title:'법인카드 사용 및 정산 가이드', type:'매뉴얼', dept:'총무', date:'2026-04-11', views:701, body:'법인카드는 업무 목적으로만 사용하며, 사용 후 3영업일 내 정산 시스템에 영수증을 등록해야 합니다.' },
    { id:'d8', title:'회의실 예약 시스템 사용법', type:'위키', dept:'총무', date:'2026-03-22', views:390, body:'회의실 예약은 사내 캘린더와 연동되어 있으며, 예약 시 참석자 초대 메일이 자동 발송됩니다.' },
  ];
  const NS = '01a';

  function renderPopular() {
    const top = DOCS.slice().sort((a, b) => b.views - a.views).slice(0, 4);
    document.getElementById('popular-list').innerHTML = top.map((d, i) => (
      '<a href="./variant-a-detail.html?id=' + d.id + '" style="text-decoration:none;color:inherit;display:block;padding:12px 0;' + (i < top.length - 1 ? 'border-bottom:1px solid var(--hairline)' : '') + '">' +
      '<b style="font-size:13px">' + d.title + '</b> <span class="chip chip-info" style="margin-left:6px">' + d.type + '</span>' +
      (sgIsFavorite(NS, d.id) ? ' <span class="chip chip-success">★</span>' : '') +
      '<div style="font-size:12px;color:var(--slate-500);margin-top:4px">' + d.dept + ' · ' + d.date + ' 갱신 · 조회 ' + d.views.toLocaleString() + '</div>' +
      '</a>'
    )).join('');
  }
  renderPopular();

  function runQuickSearch(q) {
    window.location.href = './variant-a-results.html?q=' + encodeURIComponent(q);
  }
  document.getElementById('home-search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const q = document.getElementById('home-search-input').value.trim();
    window.location.href = './variant-a-results.html' + (q ? '?q=' + encodeURIComponent(q) : '');
  });
</script>
</body>
</html>
