<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RPA 자동화 대시보드 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">RPA 자동화 대시보드 폴더</a></div>
    <h1>RPA 기반 반복 업무 자동화 대시보드 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 관리자 운영 대시보드형</h4>
      <ul><li>등록된 자동화 전체의 성공/실패 현황을 한눈에 파악해야 하는 관리자를 위한 StatCard+표 레이아웃</li><li>표의 각 행을 누르면 해당 자동화의 상세(실행이력·설정)로 이동합니다</li></ul>
    </div>

    <div class="grid" style="margin-bottom:16px">
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">등록된 자동화</div><div class="value">32건</div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#059669,transparent)"></div><div class="label">오늘 성공</div><div class="value">128건</div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#f43f5e,transparent)"></div><div class="label">오늘 실패</div><div class="value">3건</div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#60A5FA,transparent)"></div><div class="label">절감 시간(월)</div><div class="value">412시간</div></div>
    </div>

    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>자동화명</th><th>업무 유형</th><th>다음 실행</th><th>최근 결과</th><th>상태</th></tr></thead>
      <tbody id="auto-tbody"></tbody>
    </table></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const AUTOS = [
    { id:'a1', name:'일일 매출 집계 → 엑셀 발송', type:'보고서', next:'내일 07:00', result:'성공', status:'활성' },
    { id:'a2', name:'신규 발주서 ERP 입력', type:'데이터입력', next:'10분 후', result:'성공', status:'활성' },
    { id:'a3', name:'거래처 세금계산서 발행', type:'회계', next:'-', result:'실패', status:'점검중' },
    { id:'a4', name:'급여 데이터 검증', type:'인사', next:'매월 25일', result:'성공', status:'일시중지' },
  ];
  function chipClass(v) { return v === '성공' || v === '활성' ? 'chip-success' : v === '실패' ? 'chip-error' : v === '점검중' ? 'chip-warn' : 'chip-muted'; }
  document.getElementById('auto-tbody').innerHTML = AUTOS.map((a) => (
    '<tr style="cursor:pointer" onclick="location.href=\'./variant-a-detail.html?id=' + a.id + '\'"><td>' + a.name + '</td><td>' + a.type + '</td><td>' + a.next + '</td><td><span class="chip ' + chipClass(a.result) + '">' + a.result + '</span></td><td><span class="chip ' + chipClass(a.status) + '">' + a.status + '</span></td></tr>'
  )).join('');
</script>
</body>
</html>
