<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RPA 자동화 대시보드 — 시안 B</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">RPA 자동화 대시보드 폴더</a></div>
    <h1>RPA 기반 반복 업무 자동화 대시보드 — 시안 B</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 담당자 카드형(내 자동화 관리)</h4>
      <ul><li>표보다 카드+토글이 "내가 담당하는 자동화 몇 개를 관리"하는 현업 담당자에게 더 직관적</li><li>스위치로 자동화를 바로 켜고 끄고, 카드를 열면 상세에서 즉시 실행해볼 수 있음</li></ul>
    </div>

    <div class="page-title-row"><h2>내 자동화</h2><a href="./variant-b-new.html" class="btn-primary btn-sm">+ 새 자동화 등록</a></div>
    <div class="grid" id="auto-grid"></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '03b';
  const SEED = [
    { id:'b1', name:'일일 매출 집계', freq:'매일 07:00 실행', status:true, lastResult:'성공' },
    { id:'b2', name:'신규 발주서 ERP 입력', freq:'10분마다 실행', status:true, lastResult:'성공' },
    { id:'b3', name:'세금계산서 발행', freq:'매일 18:00 실행', status:false, lastResult:'실패 — 점검 필요' },
    { id:'b4', name:'급여 데이터 검증', freq:'매월 25일 실행', status:false, lastResult:'일시중지됨' },
  ];
  function loadAutos() {
    let list = sgGetJSON('sg-automations-' + NS, null);
    if (!list) { list = SEED; sgSetJSON('sg-automations-' + NS, list); }
    return list;
  }
  function saveAutos(list) { sgSetJSON('sg-automations-' + NS, list); }
  function render() {
    const list = loadAutos();
    document.getElementById('auto-grid').innerHTML = list.map((a) => (
      '<div class="glass-panel"><div class="panel-head"><div><h3 style="cursor:pointer" onclick="location.href=\'./variant-b-detail.html?id=' + a.id + '\'">' + a.name + '</h3><p>' + a.freq + '</p></div>' +
      '<button class="switch" data-on="' + a.status + '" role="switch" aria-checked="' + a.status + '" onclick="onToggle(event,\'' + a.id + '\',this)"><span class="knob"></span></button></div>' +
      '<span class="chip ' + (a.lastResult.includes('성공') ? 'chip-success' : a.lastResult.includes('실패') ? 'chip-error' : 'chip-muted') + '">' + a.lastResult + '</span></div>'
    )).join('');
  }
  function onToggle(e, id, btn) {
    e.stopPropagation();
    const list = loadAutos();
    const item = list.find((a) => a.id === id);
    item.status = !item.status;
    saveAutos(list);
    toggleSwitch(btn);
    showSnack(item.status ? 'success' : 'info', item.status ? '자동화를 켰습니다.' : '자동화를 껐습니다.');
  }
  render();
</script>
</body>
</html>
