<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이메일/푸시 빌더 — 시안 B (3단계 위저드)</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>.wizard-shell{max-width:520px;margin:0 auto}.wizard-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card);padding:24px}</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">이메일/푸시 빌더 폴더</a></div>
    <h1>이메일/푸시 빌더 — 시안 B</h1>
    <p>콘텐츠 작성 → 대상 선택 → 예약 발송 3단계 위저드. 처음 쓰는 실무자가 실수 없이 순서대로 진행하도록 유도하는 방식.</p>
  </header>

  <div class="page-frame">
    <div class="wizard-shell">
      <div class="progress-track" style="margin-bottom:16px"><div class="progress-fill" id="wiz-progress" style="width:33%"></div></div>
      <div class="stepper" id="wiz-stepper" style="margin-bottom:20px">
        <div class="step" data-done="false" data-active="true"><span class="circle">1</span><span class="label">콘텐츠 작성</span></div>
        <div class="step-line"></div>
        <div class="step" data-done="false" data-active="false"><span class="circle">2</span><span class="label">대상 선택</span></div>
        <div class="step-line"></div>
        <div class="step" data-done="false" data-active="false"><span class="circle">3</span><span class="label">예약 발송</span></div>
      </div>
      <div class="wizard-card">
        <div class="wiz-panel" data-step="0">
          <div class="fs-title" style="margin-bottom:10px">콘텐츠를 작성하세요</div>
          <div class="field"><label>제목<span class="req">*</span></label><input class="input" placeholder="가을맞이 신규가입 혜택 안내" /></div>
          <div class="field"><label>본문<span class="req">*</span></label><textarea rows="3" placeholder="본문을 입력하세요"></textarea></div>
        </div>
        <div class="wiz-panel" data-step="1" hidden>
          <div class="fs-title" style="margin-bottom:10px">발송 대상을 선택하세요</div>
          <label class="check-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" checked /> 신규 가입자 (7일 이내)</label>
          <label class="check-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" checked /> 휴면 사용자 (30일 이상)</label>
          <label class="check-row" style="display:flex;align-items:center;gap:8px"><input type="checkbox" /> 전체 사용자</label>
        </div>
        <div class="wiz-panel" data-step="2" hidden>
          <div class="fs-title" style="margin-bottom:10px">발송 시점을 정하세요</div>
          <div class="row" style="margin-bottom:12px"><button class="switch" data-on="true" role="switch" aria-checked="true" onclick="toggleSwitch(this)"><span class="knob"></span></button><span style="font-size:13px">예약 발송</span></div>
          <div class="field"><label>발송 일시</label><input class="input" value="2026-09-28 10:00" /></div>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:20px">
          <button class="btn-outline btn-sm" id="wiz-prev" onclick="wizPrev()" disabled>이전</button>
          <button class="btn-primary btn-sm" id="wiz-next" onclick="wizNext()">다음</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const WIZ_TOTAL = 3;
  let wizStep = 0;
  function wizRender() {
    setStepper('wiz-stepper', wizStep);
    document.querySelectorAll('.wiz-panel').forEach((p) => { p.hidden = Number(p.dataset.step) !== wizStep; });
    document.getElementById('wiz-prev').disabled = wizStep === 0;
    document.getElementById('wiz-next').textContent = wizStep === WIZ_TOTAL - 1 ? '예약 완료' : '다음';
    document.getElementById('wiz-progress').style.width = Math.round(((wizStep + 1) / WIZ_TOTAL) * 100) + '%';
  }
  function wizNext() { if (wizStep < WIZ_TOTAL - 1) { wizStep++; wizRender(); } else { showSnack('success', '예약 발송이 설정되었습니다.'); } }
  function wizPrev() { if (wizStep > 0) { wizStep--; wizRender(); } }
</script>
</body>
</html>
