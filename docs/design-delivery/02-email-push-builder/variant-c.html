<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이메일/푸시 빌더 — 시안 C (템플릿 갤러리)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">이메일/푸시 빌더 폴더</a></div>
    <h1>이메일/푸시 빌더 — 시안 C</h1>
    <p>템플릿을 먼저 고르고 시작하는 갤러리형. 매번 새로 쓰기보다 이전에 쓰던 형식을 재사용하는 팀에게 가장 빠른 방식.</p>
  </header>

  <div class="page-frame">
    <div class="page-title-row"><h2>템플릿 선택</h2><button class="btn-outline btn-sm">빈 템플릿으로 시작</button></div>

    <div class="grid">
      <div class="pick-card" data-selected="true" onclick="selectOnlyCard(this)">
        <span class="check">✓</span>
        <div style="height:56px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b7cff);margin-bottom:10px"></div>
        <b>프로모션 안내</b>
        <div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">할인/쿠폰 강조형 · 최근 12회 사용</div>
      </div>
      <div class="pick-card" data-selected="false" onclick="selectOnlyCard(this)">
        <span class="check">✓</span>
        <div style="height:56px;border-radius:8px;background:linear-gradient(135deg,#EC4899,#f472b6);margin-bottom:10px"></div>
        <b>신규가입 환영</b>
        <div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">온보딩 안내형 · 최근 8회 사용</div>
      </div>
      <div class="pick-card" data-selected="false" onclick="selectOnlyCard(this)">
        <span class="check">✓</span>
        <div style="height:56px;border-radius:8px;background:linear-gradient(135deg,#60A5FA,#93c5fd);margin-bottom:10px"></div>
        <b>리텐션 리마인더</b>
        <div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">휴면 사용자 대상 · 최근 5회 사용</div>
      </div>
      <div class="pick-card" data-selected="false" onclick="selectOnlyCard(this)">
        <span class="check">✓</span>
        <div style="height:56px;border-radius:8px;background:linear-gradient(135deg,#14B8A6,#5eead4);margin-bottom:10px"></div>
        <b>공지사항</b>
        <div style="font-size:11.5px;color:var(--slate-500);margin-top:4px">일반 안내형 · 최근 20회 사용</div>
      </div>
    </div>

    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn-outline btn-sm">취소</button>
      <button class="btn-primary btn-sm" onclick="showSnack('info','선택한 템플릿으로 편집 화면을 엽니다.')">이 템플릿으로 시작</button>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
