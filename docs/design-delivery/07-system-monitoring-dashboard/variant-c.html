<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시스템 모니터링 — 시안 C</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>
  .console-row { display:grid; grid-template-columns:1fr 90px 110px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--hairline); font-family:ui-monospace,monospace; font-size:12px; cursor:pointer; }
  .console-row:last-child { border-bottom:none; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:20px; justify-content:flex-end; }
  .spark span { width:4px; border-radius:1px; background:var(--accent); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <div class="page-head-actions">
      <div class="dropdown palette-picker">
        <button type="button" class="theme-toggle" onclick="toggleDropdown(event,this)">🎨 색상</button>
        <div class="dropdown-menu right palette-menu" hidden onclick="event.stopPropagation()">
          <button class="item" data-palette="violet" aria-current="true" onclick="setPalette('violet');closeDropdown()"><span class="palette-dot" style="background:#6D5DFE"></span>보라(기본)</button>
          <button class="item" data-palette="blue" aria-current="false" onclick="setPalette('blue');closeDropdown()"><span class="palette-dot" style="background:#2563EB"></span>블루</button>
          <button class="item" data-palette="teal" aria-current="false" onclick="setPalette('teal');closeDropdown()"><span class="palette-dot" style="background:#0D9488"></span>틸</button>
          <button class="item" data-palette="green" aria-current="false" onclick="setPalette('green');closeDropdown()"><span class="palette-dot" style="background:#059669"></span>그린</button>
          <button class="item" data-palette="orange" aria-current="false" onclick="setPalette('orange');closeDropdown()"><span class="palette-dot" style="background:#EA580C"></span>오렌지</button>
          <button class="item" data-palette="pink" aria-current="false" onclick="setPalette('pink');closeDropdown()"><span class="palette-dot" style="background:#DB2777"></span>핑크</button>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    </div>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">시스템 모니터링 폴더</a></div>
    <h1>시스템 성능·운영 모니터링 대시보드 — 시안 C</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>방향성 — 모니터링 콘솔형(SRE·인프라 담당자용)</h4>
      <ul><li>모노스페이스 숫자 + 미니 스파크라인으로 이상 수치를 빠르게 스캔 (다크모드로 보면 더 어울립니다)</li><li>지표를 눌러 상세에서 알림 임계치를 직접 설정</li></ul>
    </div>

    <div class="page-title-row"><h2>인프라 지표</h2><span class="chip chip-success">● LIVE</span></div>

    <div class="glass-panel">
      <div class="console-row" style="font-family:inherit;font-weight:700;color:var(--slate-400);font-size:11px;text-transform:uppercase;cursor:default">
        <span>지표</span><span style="text-align:right">현재값</span><span style="text-align:right">추이 (1h)</span>
      </div>
      <div id="metric-rows"></div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
<script>
  const NS = '07c';
  const METRICS = [
    { id:'m1', name:'cpu.usage.avg', value:'42%', spark:[10,12,9,14,11,13,12], color:null },
    { id:'m2', name:'mem.usage.avg', value:'68%', spark:[14,15,14,16,15,16,17], color:null },
    { id:'m3', name:'api.p99_latency_ms', value:'842 ▲', spark:[8,9,10,14,17,19,20], color:'#f43f5e' },
    { id:'m4', name:'queue.depth', value:'12 ▼', spark:[18,15,13,10,8,7,6], color:'#059669' },
  ];
  function sparkline(vals, color) {
    return '<span class="spark">' + vals.map((h) => '<span style="height:' + h + 'px' + (color ? ';background:' + color : '') + '"></span>').join('') + '</span>';
  }
  document.getElementById('metric-rows').innerHTML = METRICS.map((m) => {
    const th = sgGetJSON(NS + '-threshold-' + m.id, null);
    return '<div class="console-row" onclick="location.href=\'./variant-c-detail.html?id=' + m.id + '\'" style="' + (m.color ? 'color:' + m.color : '') + '">' +
      '<span>' + m.name + (th ? ' <span style="font-size:10px;color:var(--slate-400)">(임계치 ' + th + ')</span>' : '') + '</span><span style="text-align:right">' + m.value + '</span>' + sparkline(m.spark, m.color) + '</div>';
  }).join('');
</script>
</body>
</html>
