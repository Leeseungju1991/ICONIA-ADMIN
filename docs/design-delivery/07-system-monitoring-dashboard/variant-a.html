<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시스템 모니터링 — 시안 A</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>.svc-card{border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--shadow-card);border-top:3px solid var(--emerald-600)}.svc-card.warn{border-top-color:var(--amber-600)}.svc-card.down{border-top-color:var(--rose-500)}</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 전체 목록</a> · <a href="./README.md">시스템 모니터링 폴더</a></div>
    <h1>시스템 성능·운영 모니터링 대시보드 — 시안 A</h1>
  </header>

  <div class="page-frame">
    <div class="brief-box">
      <h4>기능</h4>
      <ul><li>서비스별 상태(정상/경고/장애)와 가동시간(%)을 카드로 요약</li></ul>
      <h4>UI/UX</h4>
      <ul><li>상단 색 바로 상태를 즉시 구분 — 여러 서비스를 동시에 감시하는 상황판형</li></ul>
    </div>

    <div class="grid">
      <div class="svc-card"><b style="font-size:13px">API 서버</b><div style="font-size:22px;font-weight:800;margin-top:6px">99.98%</div><span class="chip chip-success" style="margin-top:6px;display:inline-block">정상</span></div>
      <div class="svc-card warn"><b style="font-size:13px">결제 게이트웨이</b><div style="font-size:22px;font-weight:800;margin-top:6px">98.2%</div><span class="chip chip-warn" style="margin-top:6px;display:inline-block">지연 감지</span></div>
      <div class="svc-card"><b style="font-size:13px">푸시 알림 서버</b><div style="font-size:22px;font-weight:800;margin-top:6px">100%</div><span class="chip chip-success" style="margin-top:6px;display:inline-block">정상</span></div>
      <div class="svc-card down"><b style="font-size:13px">배치 작업 서버</b><div style="font-size:22px;font-weight:800;margin-top:6px">92.1%</div><span class="chip chip-error" style="margin-top:6px;display:inline-block">장애</span></div>
    </div>

    <div class="banner error" style="margin-top:16px"><span class="icon">✕</span><div><p class="title">배치 작업 서버 — 응답 없음</p><p class="desc">09:12부터 발생, 담당팀에 자동 알림 발송됨.</p></div></div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
