<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리드 상세 — 시안 C (단일 스크롤 + 앵커)</title>
<link rel="stylesheet" href="../components/tokens.css" />
<style>
  .anchor-layout { display:grid; grid-template-columns:140px 1fr; gap:20px; }
  .anchor-nav { position:sticky; top:20px; display:flex; flex-direction:column; gap:4px; align-self:start; }
  .anchor-nav a { font-size:12px; color:var(--slate-600); text-decoration:none; padding:6px 10px; border-radius:8px; }
  .anchor-nav a:hover { background:var(--surface-2); color:var(--accent); }
  .anchor-section { margin-bottom:24px; scroll-margin-top:16px; }
  .anchor-section h3 { font-size:14px; font-weight:700; margin:0 0 10px; }
  @media (max-width:720px) { .anchor-layout { grid-template-columns:1fr; } .anchor-nav { position:static; flex-direction:row; overflow-x:auto; } }
</style>
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">리드 상세 폴더</a></div>
    <h1>리드 상세 — 시안 C</h1>
    <p>모든 섹션을 세로로 쭉 이어붙이고 좌측 앵커로 점프하는 단일 스크롤형. 탭으로 숨기지 않고 Ctrl+F 검색이 되게 하고 싶을 때.</p>
  </header>

  <div class="page-frame">
    <div class="anchor-layout">
      <nav class="anchor-nav">
        <a href="#sec-info">기본 정보</a>
        <a href="#sec-activity">활동</a>
        <a href="#sec-notes">메모</a>
        <a href="#sec-danger">위험 구역</a>
      </nav>
      <div>
        <div class="page-title-row"><h2>숨코리아 · 김하나</h2><span class="chip chip-info">신규</span></div>

        <section class="anchor-section" id="sec-info">
          <h3>기본 정보</h3>
          <div class="glass-panel kv-list">
            <div class="kv-row"><span class="k">회사</span><span class="v">숨코리아</span></div>
            <div class="kv-row"><span class="k">연락처</span><span class="v">010-1234-5678</span></div>
            <div class="kv-row"><span class="k">담당</span><span class="v">박영업</span></div>
          </div>
        </section>

        <section class="anchor-section" id="sec-activity">
          <h3>활동</h3>
          <div class="expand-row"><div class="head"><div>첫 통화 완료 · 09-25</div><button class="toggle-btn" onclick="toggleAccordion(this)">펼침</button></div><div class="detail" hidden>관심도 높음, 제안서 요청함</div></div>
        </section>

        <section class="anchor-section" id="sec-notes">
          <h3>메모</h3>
          <div class="glass-panel"><textarea rows="3" placeholder="메모">가격 협상 여지 있음.</textarea></div>
        </section>

        <section class="anchor-section" id="sec-danger">
          <h3>위험 구역</h3>
          <div class="danger-zone"><div style="font-size:12px;color:var(--slate-600)">이 리드를 종료 처리</div><button class="btn-danger btn-sm">종료</button></div>
        </section>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
