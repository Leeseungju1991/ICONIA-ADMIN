<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리드 상세 — 시안 A (탭 기반)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">리드 상세 폴더</a></div>
    <h1>리드 상세 — 시안 A</h1>
    <p>기본정보/활동/메모를 탭으로 나눈 정통 상세 화면. 정보량이 많아도 화면이 길어지지 않습니다.</p>
  </header>

  <div class="page-frame">
    <div class="page-title-row">
      <h2>숨코리아 · 김하나 <span class="chip chip-info" style="margin-left:8px">신규</span></h2>
      <div class="dropdown"><button class="btn-outline btn-sm" onclick="toggleDropdown(event,this)">작업 ▾</button>
        <div class="dropdown-menu right" hidden><button class="item" onclick="closeDropdown()">담당자 변경</button><button class="item" onclick="closeDropdown()">단계 변경</button><hr /><button class="item danger" onclick="closeDropdown()">리드 삭제</button></div>
      </div>
    </div>

    <div class="tabs" role="tablist" style="margin-bottom:14px">
      <button class="tab" role="tab" aria-selected="true" onclick="switchTab(this,'t1')">기본 정보</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'t2')">활동 내역</button>
      <button class="tab" role="tab" aria-selected="false" onclick="switchTab(this,'t3')">메모</button>
    </div>

    <div class="tab-panel" data-panel="t1">
      <div class="glass-panel kv-list">
        <div class="kv-row"><span class="k">회사</span><span class="v">숨코리아</span></div>
        <div class="kv-row"><span class="k">담당자</span><span class="v">김하나 · 대표</span></div>
        <div class="kv-row"><span class="k">연락처</span><span class="v">010-1234-5678</span></div>
        <div class="kv-row"><span class="k">영업 담당</span><span class="v">박영업</span></div>
        <div class="kv-row"><span class="k">리드 점수</span><span class="v">82 / 100</span></div>
      </div>
    </div>
    <div class="tab-panel" data-panel="t2" hidden>
      <div class="expand-row"><div class="head"><div>첫 통화 완료</div><button class="toggle-btn" onclick="toggleAccordion(this)">펼침</button></div><div class="detail" hidden>2026-09-25 · 관심도 높음, 제안서 요청함</div></div>
      <div class="expand-row"><div class="head"><div>웹사이트 문의 접수</div><button class="toggle-btn" onclick="toggleAccordion(this)">펼침</button></div><div class="detail" hidden>2026-09-20 · 가격 문의</div></div>
    </div>
    <div class="tab-panel" data-panel="t3" hidden>
      <div class="field"><textarea rows="4" placeholder="메모를 입력하세요">가격 협상 여지 있음. 다음주 화요일 재통화 예정.</textarea></div>
      <button class="btn-primary btn-sm" onclick="showSnack('success','메모가 저장되었습니다.')">저장</button>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
