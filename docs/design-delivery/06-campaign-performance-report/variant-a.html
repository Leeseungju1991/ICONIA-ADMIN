<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캠페인 성과 리포트 — 시안 A (KPI+채널 표)</title>
<link rel="stylesheet" href="../components/tokens.css" />
</head>
<body>
<div class="app-shell">
  <header class="page-head">
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 다크모드</button>
    <div class="crumb-nav"><a href="../README.md">← 시안 목록</a> · <a href="./README.md">캠페인 성과 리포트 폴더</a></div>
    <h1>캠페인 성과 리포트 — 시안 A</h1>
    <p>핵심 KPI를 위에 두고, 채널별 세부 표를 아래에 배치한 정통 리포트형. 정기 보고서와 가장 가까운 구성.</p>
  </header>

  <div class="page-frame">
    <div class="page-toolbar">
      <div class="page-title-row grow" style="margin-bottom:0"><h2>9월 캠페인 성과</h2></div>
      <div class="dropdown"><button class="btn-outline btn-sm" onclick="toggleDropdown(event,this)">이번 달 ▾</button>
        <div class="dropdown-menu" hidden><button class="item" onclick="closeDropdown()">이번 주</button><button class="item" onclick="closeDropdown()">이번 달</button><button class="item" onclick="closeDropdown()">이번 분기</button></div>
      </div>
      <button class="btn-outline btn-sm">CSV 내보내기</button>
    </div>

    <div class="grid" style="margin-bottom:16px">
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,var(--accent),transparent)"></div><div class="label">총 노출</div><div class="value">402,400</div><div class="delta"><span class="up">▲14%</span></div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#EC4899,transparent)"></div><div class="label">총 클릭</div><div class="value">13,820</div><div class="delta"><span class="up">▲9%</span></div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#60A5FA,transparent)"></div><div class="label">평균 CTR</div><div class="value">3.4%</div><div class="delta"><span class="flat">전월과 비슷</span></div></div>
      <div class="stat-card"><div class="blob" style="background:radial-gradient(circle,#059669,transparent)"></div><div class="label">전환</div><div class="value">468건</div><div class="delta"><span class="up">▲6%p</span></div></div>
    </div>

    <div class="glass-panel">
      <div class="panel-head"><div><h3>채널별 성과</h3></div></div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>채널</th><th>노출</th><th>클릭</th><th>CTR</th><th>전환</th></tr></thead>
          <tbody>
            <tr><td>이메일</td><td>210,000</td><td>5,900</td><td>2.8%</td><td>180건</td></tr>
            <tr><td>카카오</td><td>62,000</td><td>3,800</td><td>6.1%</td><td>142건</td></tr>
            <tr><td>앱 푸시</td><td>98,400</td><td>3,120</td><td>3.2%</td><td>96건</td></tr>
            <tr><td>SMS</td><td>32,000</td><td>1,000</td><td>3.1%</td><td>50건</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="snackbar-stack"></div>
<script src="../components/interactions.js"></script>
</body>
</html>
